<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>System Admin | MVX STORE</title>
    
    <script>
        const userRole = sessionStorage.getItem('mvx_role');
        if (userRole !== 'admin' && userRole !== 'owner') {
            window.location.replace('index.html');
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body { background-color: var(--bg-base); padding: 20px; padding-bottom: 80px; }
        
        .admin-header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .admin-header-box h1 { font-family: var(--font-tech); font-size: 24px; color: var(--primary); }
        .btn-back-home { background: var(--bg-surface); color: var(--text-primary); padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-color); font-weight: 600; cursor: pointer; }
        
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 15px; background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 10px; font-family: var(--font-body); font-weight: 700; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-dim); color: var(--primary); border-color: var(--primary); }

        .data-panel { display: none; }
        .data-panel.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .list-card { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .list-card img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
        .list-info { flex: 1; overflow: hidden; }
        .list-info h3 { font-size: 16px; color: #fff; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-info p { font-size: 12px; color: var(--text-secondary); }
        
        .action-btns { display: flex; gap: 8px; }
        .act-btn { width: 40px; height: 40px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .act-approve { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .act-reject, .act-delete { background: rgba(255, 0, 60, 0.1); color: var(--danger); border: 1px solid rgba(255,0,60,0.3); }
        .act-approve:hover { background: #00ff88; color: #000; }
        .act-reject:hover, .act-delete:hover { background: var(--danger); color: #fff; }

        .empty-msg { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="admin-header-box">
        <h1><i class="fas fa-shield-alt"></i> ADMIN PANEL</h1>
        <button class="btn-back-home" onclick="window.location.href='index.html'"><i class="fas fa-home"></i> Store</button>
    </div>

    <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('pending')">Pending Apps</button>
        <button class="tab-btn" onclick="switchTab('live')">Live Store Apps</button>
    </div>

    <div id="pendingPanel" class="data-panel active">
        <div id="pendingList">
            <div class="empty-msg"><i class="fas fa-spinner fa-spin" style="font-size:24px; color:var(--primary);"></i><br><br>Loading Pending Apps...</div>
        </div>
    </div>

    <div id="livePanel" class="data-panel">
        <div id="liveList">
            <div class="empty-msg"><i class="fas fa-spinner fa-spin" style="font-size:24px; color:var(--primary);"></i><br><br>Loading Live Apps...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const db = firebase.database();

        // UI Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.data-panel').forEach(panel => panel.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId + 'Panel').classList.add('active');
        }

        // =========================================================
        // 1. LOAD PENDING APPS
        // =========================================================
        db.ref('pending_apps').on('value', (snapshot) => {
            const list = document.getElementById('pendingList');
            if (!snapshot.exists()) {
                list.innerHTML = `<div class="empty-msg"><i class="fas fa-check-circle" style="font-size:30px; color:#00ff88;"></i><br><br>No pending applications.</div>`;
                return;
            }

            let html = '';
            snapshot.forEach((child) => {
                const app = child.val();
                html += `
                    <div class="list-card">
                        <img src="${app.logoUrl}" onerror="this.src='https://via.placeholder.com/50/121212/00e6b8?text=APP'">
                        <div class="list-info">
                            <h3>${app.appName}</h3>
                            <p>By ${app.uploaderName} • Type: ${app.category}</p>
                        </div>
                        <div class="action-btns">
                            <button class="act-btn act-approve" onclick="approveApp('${child.key}')" title="Approve"><i class="fas fa-check"></i></button>
                            <button class="act-btn act-reject" onclick="rejectPendingApp('${child.key}')" title="Reject"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        });

        // =========================================================
        // 2. LOAD LIVE APPS
        // =========================================================
        db.ref('store_apps').on('value', (snapshot) => {
            const list = document.getElementById('liveList');
            if (!snapshot.exists()) {
                list.innerHTML = `<div class="empty-msg">Store is currently empty.</div>`;
                return;
            }

            let html = '';
            snapshot.forEach((child) => {
                const app = child.val();
                html += `
                    <div class="list-card">
                        <img src="${app.logoUrl}" onerror="this.src='https://via.placeholder.com/50/121212/00e6b8?text=APP'">
                        <div class="list-info">
                            <h3>${app.appName}</h3>
                            <p>v${app.version} • ${app.downloads || 0} Downloads</p>
                        </div>
                        <div class="action-btns">
                            <button class="act-btn act-delete" onclick="deleteLiveApp('${child.key}', '${app.appName}')" title="Delete from Store"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        });

        // =========================================================
        // 3. ADMIN ACTIONS (Approve, Reject, Delete)
        // =========================================================
        window.approveApp = function(appId) {
            if(confirm("Approve this app and publish to store?")) {
                db.ref(`pending_apps/${appId}`).once('value').then(snap => {
                    let appData = snap.val();
                    appData.status = 'approved';
                    appData.approvedAt = firebase.database.ServerValue.TIMESTAMP;

                    db.ref(`store_apps/${appId}`).set(appData).then(() => {
                        db.ref(`pending_apps/${appId}`).remove();
                        alert("App Published Successfully!");
                    });
                });
            }
        };

        window.rejectPendingApp = function(appId) {
            if(confirm("Reject and delete this pending request?")) {
                db.ref(`pending_apps/${appId}`).remove().then(() => alert("Request Deleted."));
            }
        };

        window.deleteLiveApp = function(appId, appName) {
            if(confirm(`⚠️ WARNING: Are you sure you want to PERMANENTLY DELETE "${appName}" from the live store?`)) {
                db.ref(`store_apps/${appId}`).remove().then(() => alert(`${appName} has been deleted from the store.`));
            }
        };

    </script>
</body>
</html>
