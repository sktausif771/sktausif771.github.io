<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e6b8">
    <title>User Authentication | ACCOUNT SAVING</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* ==========================================================================
           ACCOUNT SAVING - USER LOGIN & PROFILE PAGE
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #00e6b8; --primary-dim: rgba(0, 230, 184, 0.15);
            --danger: #ff003c; --bg-void: #000000; --bg-card: #0c101a; --bg-input: #1a1f2c;
            --text-primary: #ffffff; --text-muted: #9ca3af; --gold: #ffd700;
            --glass-bg: rgba(8, 11, 18, 0.85); --glass-border: 1px solid rgba(0, 230, 184, 0.2);
            --font-head: 'Rajdhani', sans-serif; --font-body: 'Space Grotesk', sans-serif;
        }

        body { background: var(--bg-void); color: var(--text-primary); font-family: var(--font-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        /* Background Effects */
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 230, 184, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 230, 184, 0.03) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; animation: gridShift 15s linear infinite; }
        .glow-orb { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; background: radial-gradient(circle at center, rgba(0, 230, 184, 0.1) 0%, transparent 70%); filter: blur(50px); z-index: -1; animation: orbFloat 10s ease-in-out infinite alternate; }
        @keyframes gridShift { 0% { background-position: 0 0; } 100% { background-position: 50px 50px; } }
        @keyframes orbFloat { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* Auth Container */
        .auth-container { width: 90%; max-width: 420px; padding: 35px 30px; background: var(--glass-bg); backdrop-filter: blur(15px); border: var(--glass-border); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 5; text-align: center; position: relative; overflow: hidden; max-height: 95vh; overflow-y: auto; }
        
        .brand-logo { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--primary); margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }

        /* Forms */
        .form-section { display: none; animation: fadeIn 0.4s ease; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        .input-group i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; }
        .form-control { width: 100%; padding: 15px 15px 15px 45px; background: var(--bg-input); border: 1px solid #333; border-radius: 12px; color: #fff; font-family: var(--font-body); font-size: 1rem; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-dim); }

        /* Buttons */
        .btn { width: 100%; padding: 15px; border-radius: 12px; font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { box-shadow: 0 0 20px var(--primary-dim); transform: translateY(-2px); }
        
        .btn-google { background: #ffffff; color: #3c4043; font-family: var(--font-body); font-weight: 600; border: 1px solid #dadce0; }
        .btn-google:hover { background: #f8f9fa; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,255,255,0.1); }
        .google-icon { width: 20px; height: 20px; }

        .toggle-link { color: var(--primary); cursor: pointer; text-decoration: underline; font-weight: 600; }
        .divider { display: flex; align-items: center; margin: 20px 0; color: #555; font-size: 0.9rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #333; margin: 0 10px; }

        /* Profile Section */
        .profile-section { display: none; text-align: center; animation: fadeIn 0.4s ease; }
        
        .profile-avatar-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); padding: 4px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--primary); overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .edit-avatar-btn { position: absolute; bottom: 0; right: 0; background: var(--primary); color: #000; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: 0.3s; z-index: 10; font-size: 0.9rem;}
        .edit-avatar-btn:hover { transform: scale(1.1); }
        
        .name-input { background: transparent; border: none; border-bottom: 1px dashed #555; color: var(--text-primary); font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; text-align: center; width: 90%; outline: none; margin-bottom: 5px; transition: 0.3s; padding-bottom: 5px;}
        .name-input:focus { border-bottom: 1px solid var(--primary); }
        
        .btn-save-profile { background: var(--gold); color: #000; display: none; margin-bottom: 15px; }
        
        .profile-email { color: var(--text-muted); font-family: 'Share Tech Mono', monospace; font-size: 0.95rem; margin-bottom: 25px; display: block; }
        
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255,0,60,0.3); transform: translateY(-2px); }

        /* ================================================================
           MY UPLOADS সেকশন (এডিট/ডিলিট সহ)
           ================================================================ */
        .my-uploads-section {
            margin-top: 25px;
            border-top: 1px solid #333;
            padding-top: 20px;
            text-align: left;
        }
        .my-uploads-title {
            font-family: var(--font-head);
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upload-item {
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: 0.3s;
        }
        .upload-item:hover {
            border-color: var(--primary);
        }
        .upload-item-info {
            flex: 1;
            min-width: 0;
        }
        .upload-item-title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upload-item-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .upload-item-meta .server-tag {
            color: var(--primary);
            font-weight: 600;
        }
        .upload-item-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .upload-item-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px 8px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .upload-item-actions .edit-btn {
            color: var(--primary);
        }
        .upload-item-actions .edit-btn:hover {
            background: var(--primary-dim);
        }
        .upload-item-actions .del-btn {
            color: var(--danger);
        }
        .upload-item-actions .del-btn:hover {
            background: var(--danger-dim);
        }
        .upload-empty {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 0;
        }

        /* Loading Overlay */
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--glass-bg); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 20; border-radius: 20px; flex-direction: column; }
        .loading-overlay i { font-size: 3rem; color: var(--primary); animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ================================================================
           এডিট মোডাল (সার্ভার + রিকভারি সহ)
           ================================================================ */
        .edit-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .edit-modal-overlay.active {
            display: flex;
        }
        .edit-modal-box {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 50px var(--primary-dim);
            animation: fadeIn 0.4s ease;
        }
        .edit-modal-box h2 {
            color: var(--primary);
            font-family: var(--font-head);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            font-size: 1.3rem;
        }
        .edit-modal-box .close-edit-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            margin-left: auto;
            transition: 0.3s;
        }
        .edit-modal-box .close-edit-btn:hover {
            color: var(--danger);
        }
        .edit-form-group {
            margin-bottom: 15px;
        }
        .edit-form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .edit-form-group input,
        .edit-form-group select,
        .edit-form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .edit-form-group input:focus,
        .edit-form-group select:focus,
        .edit-form-group textarea:focus {
            border-color: var(--primary);
        }

        .edit-ban-options {
            display: flex;
            gap: 15px;
            margin: 5px 0 10px 0;
        }
        .edit-ban-option-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-head);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .edit-ban-option-btn.active-no-ban {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
        }
        .edit-ban-option-btn.active-ban {
            border-color: var(--danger);
            background: var(--danger-dim);
            color: var(--danger);
        }

        .edit-server-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 5px 0 10px 0;
        }
        .edit-server-option-btn {
            padding: 8px 5px;
            border-radius: 8px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .edit-server-option-btn:hover {
            border-color: var(--text-muted);
        }
        .edit-server-option-btn.active-server {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
        }
        .edit-server-other-box {
            display: none;
            margin-top: 10px;
        }
        .edit-server-other-box.show {
            display: block;
        }

        .edit-contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 5px 0 10px 0;
        }
        .edit-contact-btn {
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .edit-contact-btn.active-contact {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
        }

        .edit-other-game-box {
            display: none;
            margin-top: 10px;
        }
        .edit-other-game-box.show {
            display: block;
        }

        .edit-submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .edit-submit-btn:hover {
            box-shadow: 0 0 20px var(--primary-dim);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow-orb"></div>
    
    <div class="auth-container">
        <div class="loading-overlay" id="loadingOverlay">
            <i class="fas fa-circle-notch"></i>
            <p style="font-family: var(--font-head); font-weight: bold; margin-top: 10px;">Please wait...</p>
        </div>

        <div class="brand-logo">ACCOUNT SAVING</div>
        <div class="subtitle">Secure Account Management</div>

        <div class="form-section active" id="loginForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" class="form-control" placeholder="Email Address" autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" class="form-control" placeholder="Password" autocomplete="off">
            </div>
            <button class="btn btn-primary" onclick="login()"><i class="fas fa-sign-in-alt"></i> SECURE LOGIN</button>
            
            <div class="divider">OR</div>

            <button class="btn btn-google" onclick="googleLogin()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" class="google-icon"> LOGIN WITH GOOGLE
            </button>
            
            <p style="margin-top: 20px; color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <span class="toggle-link" onclick="toggleView('registerForm')">Create one</span>
            </p>
        </div>

        <div class="form-section" id="registerForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="regName" class="form-control" placeholder="Full Name" autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="regEmail" class="form-control" placeholder="Email Address" autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="regPassword" class="form-control" placeholder="Create Password" autocomplete="off">
            </div>
            <button class="btn btn-primary" onclick="register()"><i class="fas fa-user-plus"></i> REGISTER ACCOUNT</button>
            
            <div class="divider">OR</div>

            <button class="btn btn-google" onclick="googleLogin()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" class="google-icon"> CONTINUE WITH GOOGLE
            </button>
            
            <p style="margin-top: 20px; color: var(--text-muted); font-size: 0.9rem;">
                Already registered? <span class="toggle-link" onclick="toggleView('loginForm')">Login here</span>
            </p>
        </div>

        <div class="profile-section" id="profileSection">
            <div class="profile-avatar-wrapper">
                <div class="profile-avatar" id="avatarContainer">
                    <i class="fas fa-user-astronaut" id="defaultAvatarIcon"></i>
                    <img src="" id="userProfileImg" style="display:none;">
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleProfileImageSelect(this)">
                <button class="edit-avatar-btn" onclick="document.getElementById('imageInput').click()"><i class="fas fa-camera"></i></button>
            </div>
            
            <div>
                <input type="text" id="profileNameInput" class="name-input" placeholder="Your Name" oninput="showSaveBtn()">
            </div>
            <div class="profile-email" id="userEmail">user@email.com</div>

            <button class="btn btn-save-profile" id="saveProfileBtn" onclick="saveProfileChanges()">
                <i class="fas fa-save"></i> SAVE PROFILE
            </button>
            
            <button class="btn btn-primary" onclick="goToStore()">
                <i class="fas fa-store"></i> GO TO DASHBOARD
            </button>
            
            <button class="btn btn-danger" onclick="logout()" style="margin-top: 10px;">
                <i class="fas fa-power-off"></i> LOGOUT SESSION
            </button>

            <!-- ============================================================
            MY UPLOADS সেকশন (এডিট/ডিলিট সহ)
            ============================================================ -->
            <div class="my-uploads-section" id="myUploadsSection">
                <div class="my-uploads-title">
                    <i class="fas fa-cloud-upload-alt"></i> MY UPLOADS
                </div>
                <div id="myUploadsList">
                    <div class="upload-empty">Loading your posts...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================
    এডিট মোডাল
    ============================================================ -->
    <div class="edit-modal-overlay" id="editModal">
        <div class="edit-modal-box">
            <h2>
                <i class="fas fa-edit"></i> EDIT POST
                <button class="close-edit-btn" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </h2>

            <form id="editForm" onsubmit="submitEdit(event)">
                <input type="hidden" id="editPostId">

                <div class="edit-form-group">
                    <label>Ban Status</label>
                    <div class="edit-ban-options">
                        <button type="button" class="edit-ban-option-btn active-no-ban" id="editBanNo" onclick="selectEditBan('no')">
                            <i class="fas fa-check-circle" style="color: var(--primary);"></i> No Ban
                        </button>
                        <button type="button" class="edit-ban-option-btn" id="editBanYes" onclick="selectEditBan('yes')">
                            <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i> Ban
                        </button>
                    </div>
                    <input type="hidden" id="editBanStatus" value="no">
                </div>

                <div class="edit-form-group">
                    <label>Title *</label>
                    <input type="text" id="editTitle" required>
                </div>

                <div class="edit-form-group">
                    <label>Game Category *</label>
                    <select id="editCategory" onchange="toggleEditOtherGame()">
                        <option value="Free Fire">Free Fire</option>
                        <option value="PUBG">PUBG</option>
                        <option value="Blood Strike">Blood Strike</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="edit-other-game-box" id="editOtherGameBox">
                    <div class="edit-form-group">
                        <label>Other Game Name</label>
                        <input type="text" id="editOtherGame" placeholder="Enter game name...">
                    </div>
                </div>

                <!-- সার্ভার -->
                <div class="edit-form-group">
                    <label>Server *</label>
                    <div class="edit-server-options">
                        <button type="button" class="edit-server-option-btn active-server" id="editServerBD" onclick="selectEditServer('Bangladesh')">🇧🇩 BD</button>
                        <button type="button" class="edit-server-option-btn" id="editServerIN" onclick="selectEditServer('India')">🇮🇳 IN</button>
                        <button type="button" class="edit-server-option-btn" id="editServerNP" onclick="selectEditServer('Nepal')">🇳🇵 NP</button>
                        <button type="button" class="edit-server-option-btn" id="editServerPK" onclick="selectEditServer('Pakistan')">🇵🇰 PK</button>
                        <button type="button" class="edit-server-option-btn" id="editServerSG" onclick="selectEditServer('Singapore')">🇸🇬 SG</button>
                        <button type="button" class="edit-server-option-btn" id="editServerID" onclick="selectEditServer('Indonesia')">🇮🇩 ID</button>
                    </div>
                    <div class="edit-server-other-box" id="editServerOtherBox">
                        <div class="edit-form-group">
                            <label>Other Server Name</label>
                            <input type="text" id="editOtherServer" placeholder="Enter server name...">
                        </div>
                    </div>
                    <input type="hidden" id="editServer" value="Bangladesh">
                    <button type="button" class="edit-server-option-btn" style="width:100%; margin-top:5px;" onclick="toggleEditServerOther()">➕ Others</button>
                </div>

                <!-- কন্টাক্ট টাইপ -->
                <div class="edit-form-group">
                    <label>Contact Type *</label>
                    <div class="edit-contact-grid">
                        <button type="button" class="edit-contact-btn active-contact" id="editContactFacebook" onclick="selectEditContact('facebook')">
                            <i class="fab fa-facebook"></i> Facebook
                        </button>
                        <button type="button" class="edit-contact-btn" id="editContactGmail" onclick="selectEditContact('gmail')">
                            <i class="fas fa-envelope"></i> Gmail
                        </button>
                        <button type="button" class="edit-contact-btn" id="editContactTwitter" onclick="selectEditContact('twitter')">
                            <i class="fab fa-twitter"></i> Twitter
                        </button>
                        <button type="button" class="edit-contact-btn" id="editContactPhone" onclick="selectEditContact('phone')">
                            <i class="fas fa-phone"></i> Phone
                        </button>
                    </div>
                    <input type="hidden" id="editContactType" value="facebook">
                </div>

                <!-- মেইন কন্টাক্ট -->
                <div class="edit-form-group">
                    <label>Main Phone or Email (at least one) *</label>
                    <input type="text" id="editMainContact" required>
                </div>

                <!-- রিকভারি ফোন -->
                <div class="edit-form-group">
                    <label>Recovery Phone (optional)</label>
                    <input type="text" id="editRecoveryPhone" placeholder="Enter recovery phone...">
                </div>

                <!-- রিকভারি ইমেইল -->
                <div class="edit-form-group">
                    <label>Recovery Email (optional)</label>
                    <input type="email" id="editRecoveryEmail" placeholder="Enter recovery email...">
                </div>

                <button type="submit" class="edit-submit-btn">
                    <i class="fas fa-save"></i> UPDATE POST
                </button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAS3UXXrio_-c9uPbHwpDuTVrP-p8d903w",
            authDomain: "white-2k-17-v4.firebaseapp.com",
            projectId: "white-2k-17-v4",
            storageBucket: "white-2k-17-v4.firebasestorage.app",
            messagingSenderId: "180909174928",
            appId: "1:180909174928:android:148861a87d66c6980ca815"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();
        const DB_PATH = "MVX_VIP_SERVER_V5";

        let selectedBase64Image = null;
        let currentUserData = null;

        // ================================================================
        // UI Controls
        // ================================================================
        function toggleView(viewId) {
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('profileSection').style.display = 'none';
            document.querySelector('.subtitle').style.display = 'block';
            
            if(viewId === 'profileSection') {
                document.getElementById('profileSection').style.display = 'block';
                document.querySelector('.subtitle').style.display = 'none';
            } else {
                document.getElementById(viewId).classList.add('active');
            }
        }

        function showLoader(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function goToStore() {
            window.location.href = 'index.html';
        }

        // ================================================================
        // সার্ভার এডিট ফাংশন
        // ================================================================
        function selectEditServer(server) {
            const btns = document.querySelectorAll('.edit-server-option-btn');
            btns.forEach(btn => btn.classList.remove('active-server'));
            btns.forEach(btn => {
                if (btn.textContent.trim() === server || btn.textContent.trim().includes(server)) {
                    btn.classList.add('active-server');
                }
            });
            document.getElementById('editServer').value = server;
            if (server !== 'Others') {
                document.getElementById('editServerOtherBox').classList.remove('show');
            }
        }

        function toggleEditServerOther() {
            const box = document.getElementById('editServerOtherBox');
            box.classList.toggle('show');
            if (box.classList.contains('show')) {
                document.getElementById('editServer').value = 'Others';
                document.querySelectorAll('.edit-server-option-btn').forEach(btn => btn.classList.remove('active-server'));
            }
        }

        // ================================================================
        // Auth State Listener
        // ================================================================
        auth.onAuthStateChanged((user) => {
            showLoader(false);
            if (user) {
                currentUserData = user;
                document.getElementById('profileNameInput').value = user.displayName || 'MVX User';
                document.getElementById('userEmail').innerText = user.email;
                toggleView('profileSection');
                
                db.ref('registered_users/' + user.uid).on('value', (snap) => {
                    if(snap.exists()) {
                        const data = snap.val();
                        if(data.name) document.getElementById('profileNameInput').value = data.name;
                        
                        if(data.profilePicBase64 && data.profilePicBase64 !== "") {
                            document.getElementById('defaultAvatarIcon').style.display = 'none';
                            document.getElementById('userProfileImg').style.display = 'block';
                            document.getElementById('userProfileImg').src = data.profilePicBase64;
                        } else if(user.photoURL) {
                            document.getElementById('defaultAvatarIcon').style.display = 'none';
                            document.getElementById('userProfileImg').style.display = 'block';
                            document.getElementById('userProfileImg').src = user.photoURL;
                        }
                    }
                });

                loadMyUploads(user.uid);

                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                if(redirect) {
                    window.location.href = redirect;
                }

            } else {
                currentUserData = null;
                toggleView('loginForm');
            }
        });

        // ================================================================
        // MY UPLOADS লোড (সার্ভার + রিকভারি সহ)
        // ================================================================
        function loadMyUploads(uid) {
            const listEl = document.getElementById('myUploadsList');
            
            db.ref(DB_PATH).orderByChild('uid').equalTo(uid).on('value', (snap) => {
                const data = snap.val();
                listEl.innerHTML = '';

                if (!data) {
                    listEl.innerHTML = `<div class="upload-empty"><i class="fas fa-inbox"></i> No posts yet.</div>`;
                    return;
                }

                const posts = Object.entries(data).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));

                posts.forEach(([key, val]) => {
                    const item = document.createElement('div');
                    item.className = 'upload-item';

                    const banText = val.isBanned ? '🚫 Banned' : '✅ No Ban';
                    const banColor = val.isBanned ? 'var(--danger)' : 'var(--primary)';
                    const serverText = val.server || 'N/A';
                    const mainContact = val.mainContact || val.contactValue || 'N/A';

                    item.innerHTML = `
                        <div class="upload-item-info">
                            <div class="upload-item-title">${val.title || 'Untitled'}</div>
                            <div class="upload-item-meta">
                                ${val.gameCategory || 'N/A'} • 
                                <span style="color:${banColor};">${banText}</span> • 
                                <span class="server-tag"><i class="fas fa-globe"></i> ${serverText}</span>
                                ${val.timestamp ? ' • ' + timeAgo(val.timestamp) : ''}
                                <br>
                                <i class="fas fa-phone" style="font-size:0.7rem;"></i> ${mainContact}
                                ${val.recoveryPhone ? ` • <i class="fas fa-sync" style="font-size:0.7rem;"></i> ${val.recoveryPhone}` : ''}
                                ${val.recoveryEmail ? ` • <i class="fas fa-sync" style="font-size:0.7rem;"></i> ${val.recoveryEmail}` : ''}
                            </div>
                        </div>
                        <div class="upload-item-actions">
                            <button class="edit-btn" onclick="openEditModal('${key}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="del-btn" onclick="deleteMyPost('${key}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            });
        }

        // ================================================================
        // ডিলিট ফাংশন
        // ================================================================
        function deleteMyPost(postId) {
            if (!currentUserData) {
                showToast('Please login first!', 'error');
                return;
            }

            if (confirm('Are you sure you want to delete this post?')) {
                db.ref(DB_PATH + '/' + postId).once('value').then(snap => {
                    const data = snap.val();
                    if (data && data.uid === currentUserData.uid) {
                        db.ref(DB_PATH + '/' + postId).remove()
                            .then(() => showToast('✅ Post deleted!'))
                            .catch(err => showToast('Error: ' + err.message, 'error'));
                    } else {
                        showToast('You cannot delete this post!', 'error');
                    }
                });
            }
        }

        // ================================================================
        // এডিট মোডাল (সার্ভার + রিকভারি সহ)
        // ================================================================
        function openEditModal(postId) {
            if (!currentUserData) return;

            db.ref(DB_PATH + '/' + postId).once('value').then(snap => {
                const data = snap.val();
                if (!data || data.uid !== currentUserData.uid) {
                    showToast('You cannot edit this post!', 'error');
                    return;
                }

                document.getElementById('editPostId').value = postId;
                document.getElementById('editTitle').value = data.title || '';
                document.getElementById('editCategory').value = data.gameCategory || 'Free Fire';
                document.getElementById('editMainContact').value = data.mainContact || data.contactValue || '';
                document.getElementById('editRecoveryPhone').value = data.recoveryPhone || '';
                document.getElementById('editRecoveryEmail').value = data.recoveryEmail || '';

                // Ban status
                const isBanned = data.isBanned === true;
                selectEditBan(isBanned ? 'yes' : 'no');

                // Contact type
                selectEditContact(data.contactType || 'facebook');

                // Server
                const server = data.server || 'Bangladesh';
                selectEditServer(server);
                if (server === 'Others' || !['Bangladesh','India','Nepal','Pakistan','Singapore','Indonesia'].includes(server)) {
                    document.getElementById('editServerOtherBox').classList.add('show');
                    document.getElementById('editOtherServer').value = server === 'Others' ? '' : server;
                    document.getElementById('editServer').value = 'Others';
                    document.querySelectorAll('.edit-server-option-btn').forEach(btn => btn.classList.remove('active-server'));
                } else {
                    document.getElementById('editServerOtherBox').classList.remove('show');
                    selectEditServer(server);
                }

                // Other game
                if (data.gameCategory === 'Others') {
                    document.getElementById('editOtherGameBox').classList.add('show');
                    document.getElementById('editOtherGame').value = data.gameCategory || '';
                } else {
                    document.getElementById('editOtherGameBox').classList.remove('show');
                }

                document.getElementById('editModal').classList.add('active');
            });
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function selectEditBan(type) {
            const noBtn = document.getElementById('editBanNo');
            const yesBtn = document.getElementById('editBanYes');
            const hiddenInput = document.getElementById('editBanStatus');

            noBtn.classList.remove('active-no-ban', 'active-ban');
            yesBtn.classList.remove('active-no-ban', 'active-ban');

            if (type === 'no') {
                noBtn.classList.add('active-no-ban');
                hiddenInput.value = 'no';
            } else {
                yesBtn.classList.add('active-ban');
                hiddenInput.value = 'yes';
            }
        }

        function selectEditContact(type) {
            const btns = document.querySelectorAll('.edit-contact-btn');
            btns.forEach(btn => btn.classList.remove('active-contact'));
            
            const map = {
                'facebook': 'editContactFacebook',
                'gmail': 'editContactGmail',
                'twitter': 'editContactTwitter',
                'phone': 'editContactPhone'
            };
            
            document.getElementById(map[type]).classList.add('active-contact');
            document.getElementById('editContactType').value = type;
        }

        function toggleEditOtherGame() {
            const val = document.getElementById('editCategory').value;
            const box = document.getElementById('editOtherGameBox');
            if (val === 'Others') {
                box.classList.add('show');
            } else {
                box.classList.remove('show');
            }
        }

        // ================================================================
        // এডিট সাবমিট (সার্ভার + রিকভারি সহ)
        // ================================================================
        function submitEdit(e) {
            e.preventDefault();
            const postId = document.getElementById('editPostId').value;
            const btn = e.target.querySelector('.edit-submit-btn');

            const category = document.getElementById('editCategory').value;
            let gameCategory = category;
            if (category === 'Others') {
                gameCategory = document.getElementById('editOtherGame').value.trim() || 'Others';
            }

            let server = document.getElementById('editServer').value;
            if (server === 'Others') {
                server = document.getElementById('editOtherServer').value.trim() || 'Others';
            }

            const mainContact = document.getElementById('editMainContact').value.trim();
            if (!mainContact) {
                showToast('মেইন ফোন বা ইমেইল দিন!', 'error');
                return;
            }

            const data = {
                title: document.getElementById('editTitle').value.trim(),
                gameCategory: gameCategory,
                contactType: document.getElementById('editContactType').value,
                mainContact: mainContact,
                contactValue: mainContact, // ব্যাকওয়ার্ড কম্প্যাটিবিলিটি
                recoveryPhone: document.getElementById('editRecoveryPhone').value.trim(),
                recoveryEmail: document.getElementById('editRecoveryEmail').value.trim(),
                isBanned: document.getElementById('editBanStatus').value === 'yes' ? true : false,
                server: server,
                isUpdated: true,
                timestamp: Date.now()
            };

            if (!data.title) {
                showToast('টাইটেল দিন!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPDATING...';

            db.ref(DB_PATH + '/' + postId).update(data)
                .then(() => {
                    showToast('✅ Post updated successfully!');
                    closeEditModal();
                    btn.innerHTML = '<i class="fas fa-save"></i> UPDATE POST';
                    btn.disabled = false;
                })
                .catch(err => {
                    showToast('Error: ' + err.message, 'error');
                    btn.innerHTML = '<i class="fas fa-save"></i> UPDATE POST';
                    btn.disabled = false;
                });
        }

        // ================================================================
        // টাইম এগো ফাংশন
        // ================================================================
        function timeAgo(timestamp) {
            if (!timestamp) return "";
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            let interval = seconds / 86400;
            if (interval >= 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval >= 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval >= 1) return Math.floor(interval) + " mins ago";
            return "Just now";
        }

        // ================================================================
        // টোস্ট মেসেজ
        // ================================================================
        function showToast(msg, type = 'success') {
            if (typeof showGlobalToast === 'function') {
                showGlobalToast(msg, type);
                return;
            }
            alert(msg);
        }

        // ================================================================
        // প্রোফাইল আপডেট
        // ================================================================
        function handleProfileImageSelect(input) {
            const file = input.files[0];
            if(file) {
                if(file.size > 1.5 * 1024 * 1024) {
                    showToast("File must be under 1.5MB!", "error");
                    input.value = "";
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedBase64Image = e.target.result;
                    document.getElementById('defaultAvatarIcon').style.display = 'none';
                    document.getElementById('userProfileImg').style.display = 'block';
                    document.getElementById('userProfileImg').src = selectedBase64Image;
                    showSaveBtn();
                };
                reader.readAsDataURL(file);
            }
        }

        function showSaveBtn() {
            document.getElementById('saveProfileBtn').style.display = 'flex';
        }

        function saveProfileChanges() {
            const newName = document.getElementById('profileNameInput').value.trim();
            if(!newName) return;

            showLoader(true);
            let updates = { name: newName };
            if(selectedBase64Image) updates.profilePicBase64 = selectedBase64Image;

            db.ref('registered_users/' + auth.currentUser.uid).update(updates)
                .then(() => {
                    showLoader(false);
                    document.getElementById('saveProfileBtn').style.display = 'none';
                    showToast('Profile Updated!');
                })
                .catch(err => {
                    showLoader(false);
                    showToast(err.message, 'error');
                });
        }

        // ================================================================
        // অথেন্টিকেশন
        // ================================================================
        function login() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            if(!email || !pass) return;
            
            showLoader(true);
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { showToast('Login Successful!'); })
                .catch(err => {
                    showLoader(false);
                    showToast('Invalid email or password.', 'error');
                });
        }

        function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            
            if(!name || !email || !pass) return;
            if(pass.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }
            
            showLoader(true);
            auth.createUserWithEmailAndPassword(email, pass)
                .then((result) => {
                    return result.user.updateProfile({ displayName: name }).then(() => result.user);
                })
                .then((user) => {
                    db.ref('registered_users/' + user.uid).set({
                        name: name,
                        email: email,
                        joinedAt: Date.now()
                    });
                    showToast('Account Created!');
                })
                .catch(err => {
                    showLoader(false);
                    showToast(err.message, 'error');
                });
        }

        function googleLogin() {
            showLoader(true);
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    db.ref('registered_users/' + result.user.uid).once('value').then(snap => {
                        if(!snap.exists()) {
                            db.ref('registered_users/' + result.user.uid).set({
                                name: result.user.displayName,
                                email: result.user.email,
                                joinedAt: Date.now()
                            });
                        }
                    });
                    showToast('Google Login Successful!');
                })
                .catch((error) => {
                    showLoader(false);
                    showToast('Google Login Failed.', 'error');
                });
        }

        function logout() {
            showLoader(true);
            auth.signOut().then(() => {
                showToast('Logged out successfully');
                window.location.href = 'index.html';
            });
        }

        // ================================================================
        // মোডালের বাইরে ক্লিক করলে বন্ধ
        // ================================================================
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
