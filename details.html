<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>App Details | MVX STORE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Play Store Details Specific Styles */
        body { background-color: var(--bg-base); padding-bottom: 50px; }
        
        .details-top-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--bg-base); display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; z-index: 1000;
        }
        
        .details-top-nav i { font-size: 20px; color: var(--text-primary); cursor: pointer; }
        
        .details-header { margin-top: 70px; padding: 0 20px; display: flex; gap: 20px; align-items: center; }
        .details-icon { width: 80px; height: 80px; border-radius: 18px; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid var(--border-color); }
        .details-title-box { flex: 1; }
        .details-title-box h1 { font-family: var(--font-body); font-size: 22px; color: var(--text-primary); line-height: 1.2; margin-bottom: 5px; }
        .details-title-box p { color: var(--primary); font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .details-title-box span { color: var(--text-secondary); font-size: 12px; }

        .stats-row { display: flex; justify-content: space-around; margin: 25px 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .stat-item { text-align: center; border-right: 1px solid var(--border-color); flex: 1; }
        .stat-item:last-child { border-right: none; }
        .stat-item strong { display: block; font-size: 16px; color: var(--text-primary); font-weight: 700; }
        .stat-item span { font-size: 12px; color: var(--text-secondary); }

        .action-container { padding: 0 20px; margin-bottom: 25px; }
        .btn-install { width: 100%; background: var(--primary); color: #000; font-family: var(--font-body); font-size: 16px; font-weight: 700; padding: 12px; border: none; border-radius: 30px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-install:hover { background: #fff; }
        .btn-alt { width: 100%; background: transparent; color: var(--primary); font-family: var(--font-body); font-size: 14px; font-weight: 600; padding: 10px; border: 1px solid var(--border-color); border-radius: 30px; cursor: pointer; transition: 0.2s; }
        .btn-alt:hover { border-color: var(--primary); background: var(--primary-dim); }

        .screenshots-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 0 20px 20px 20px; scroll-snap-type: x mandatory; }
        .screenshots-scroll::-webkit-scrollbar { display: none; }
        .screen-img { height: 200px; border-radius: 12px; scroll-snap-align: start; border: 1px solid var(--border-color); object-fit: cover; }

        .about-section { padding: 0 20px; }
        .about-section h3 { font-family: var(--font-body); font-size: 18px; color: var(--text-primary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .about-section p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap; }
        
        .password-box { background: rgba(255, 215, 0, 0.1); border: 1px dashed var(--warning); padding: 15px; border-radius: 10px; margin-top: 15px; display: none; }
        .password-box strong { color: var(--warning); font-size: 14px; display: block; margin-bottom: 5px; }
        .password-box span { color: #fff; font-family: monospace; font-size: 16px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <nav class="details-top-nav">
        <i class="fas fa-arrow-left" onclick="window.history.back()"></i>
        <i class="fas fa-search" onclick="window.location.href='index.html'"></i>
    </nav>

    <div class="details-header">
        <img src="" id="detLogo" class="details-icon" alt="App Icon">
        <div class="details-title-box">
            <h1 id="detName">Loading...</h1>
            <p id="detDev">Developer</p>
            <span>Contains ads • In-app purchases</span>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-item">
            <strong>4.8 <i class="fas fa-star" style="font-size:10px;"></i></strong>
            <span>Reviews</span>
        </div>
        <div class="stat-item">
            <strong id="detSize">-- MB</strong>
            <span id="detVersion">v--</span>
        </div>
        <div class="stat-item">
            <strong id="detDownloads">10K+</strong>
            <span>Downloads</span>
        </div>
    </div>

    <div class="action-container">
        <button class="btn-install" id="btnMainLink">Install</button>
        <button class="btn-alt" id="btnAltLink" style="display: none;">Alternative Link</button>
    </div>

    <div class="screenshots-scroll">
        <img src="" id="detBanner" class="screen-img" alt="Banner">
    </div>

    <div class="about-section">
        <h3>About this app <i class="fas fa-arrow-right" style="font-size: 14px;"></i></h3>
        <p id="detDesc">Loading description...</p>
        
        <div class="password-box" id="detPassBox">
            <strong><i class="fas fa-lock"></i> Unzip Password:</strong>
            <span id="detPassText"></span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get('id');

            if (!appId) {
                alert("App not found.");
                window.location.replace("index.html");
                return;
            }

            const db = firebase.database();
            
            db.ref('store_apps/' + appId).once('value').then((snapshot) => {
                if(!snapshot.exists()) {
                    alert("This application is no longer available.");
                    window.location.replace("index.html");
                    return;
                }

                const app = snapshot.val();

                // Populate Data
                document.getElementById('detName').innerText = app.appName;
                document.getElementById('detDev').innerText = app.uploaderName;
                document.getElementById('detLogo').src = app.logoUrl;
                document.getElementById('detBanner').src = app.bannerUrl;
                document.getElementById('detSize').innerText = app.size;
                document.getElementById('detVersion').innerText = "v" + app.version;
                document.getElementById('detDownloads').innerText = (app.downloads || 0) + "+";
                document.getElementById('detDesc').innerText = app.description;

                // Password Logic
                if(app.zipPassword && app.zipPassword.trim() !== "") {
                    document.getElementById('detPassBox').style.display = 'block';
                    document.getElementById('detPassText').innerText = app.zipPassword;
                }

                // Main Link Logic
                const btnMain = document.getElementById('btnMainLink');
                btnMain.onclick = () => {
                    db.ref(`store_apps/${appId}/downloads`).set((app.downloads || 0) + 1);
                    window.open(app.downloadUrl, '_blank');
                };

                // Alternative Link Logic
                if(app.altLinkUrl && app.altLinkUrl.trim() !== "") {
                    const btnAlt = document.getElementById('btnAltLink');
                    btnAlt.style.display = 'block';
                    btnAlt.innerText = app.altLinkName || 'Alternative Link';
                    btnAlt.onclick = () => {
                        window.open(app.altLinkUrl, '_blank');
                    };
                }

                // Update views
                db.ref(`store_apps/${appId}/views`).set((app.views || 0) + 1);
            });
        });
    </script>
</body>
</html>
