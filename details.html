<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e6b8">
    <title>Post Details | ACCOUNT SAVING</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* ==========================================================================
           ACCOUNT SAVING - POST DETAILS PAGE (এডিট/ডিলিট ছাড়া)
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #00e6b8; --primary-dim: rgba(0, 230, 184, 0.15);
            --gold: #ffd700; --gold-dim: rgba(255, 215, 0, 0.15);
            --danger: #ff003c; --danger-dim: rgba(255, 0, 60, 0.15);
            --bg-void: #000000; --bg-card: #0c101a; --bg-input: #1a1f2c;
            --text-primary: #ffffff; --text-muted: #9ca3af;
            --glass-bg: rgba(8, 11, 18, 0.8); --glass-border: 1px solid rgba(0, 230, 184, 0.2);
            --font-head: 'Rajdhani', sans-serif; --font-body: 'Space Grotesk', sans-serif;
        }

        body { background: var(--bg-void); color: var(--text-primary); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

        /* Background Effects */
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 230, 184, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 230, 184, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: -1; }
        .glow-orb { position: fixed; width: 50vmax; height: 50vmax; border-radius: 50%; background: radial-gradient(circle at center, rgba(0, 230, 184, 0.1) 0%, transparent 70%); filter: blur(50px); pointer-events: none; z-index: -1; top: -10vmax; right: -10vmax; }

        /* Navigation Bar */
        .navbar { position: sticky; top: 0; background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: var(--glass-border); height: 60px; display: flex; align-items: center; padding: 0 20px; z-index: 100; gap: 15px; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { color: var(--primary); }
        .nav-title { font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }

        /* Main Container */
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Post Header - লোগো ছাড়া */
        .post-header { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 16px; 
            border: var(--glass-border); 
            margin-bottom: 25px;
        }
        .post-title { 
            font-size: 1.8rem; 
            font-weight: 700; 
            color: var(--primary); 
            margin-bottom: 8px;
            word-break: break-word;
        }
        .post-meta { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            font-family: 'Share Tech Mono', monospace; 
        }
        .meta-tag { 
            background: var(--bg-input); 
            padding: 5px 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
        }
        .meta-tag i { color: var(--primary); }

        /* Ban Badge */
        .ban-badge-detail {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ban-badge-detail.banned {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 20px var(--danger-dim);
        }
        .ban-badge-detail.noban {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary-dim);
        }

        /* Image Section */
        .image-section { margin-bottom: 30px; }
        .section-title { 
            font-family: var(--font-head); 
            font-size: 1.1rem; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: var(--text-muted); 
        }
        .section-title i { color: var(--primary); }
        .main-image { 
            width: 100%; 
            border-radius: 12px; 
            border: var(--glass-border); 
            background: var(--bg-card); 
        }

        /* Info Section - পরিষ্কার ফরম্যাট */
        .info-section { 
            background: var(--bg-card); 
            padding: 25px 20px; 
            border-radius: 16px; 
            border: var(--glass-border); 
            margin-bottom: 25px; 
        }
        .info-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 0; 
            border-bottom: 1px solid #222; 
            align-items: center;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { 
            color: var(--text-muted); 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .info-label i { 
            color: var(--primary); 
            width: 20px;
            text-align: center;
        }
        .info-value { 
            color: var(--text-primary); 
            font-weight: 600; 
            text-align: right;
            word-break: break-word;
            max-width: 60%;
        }
        .info-value .contact-type-badge {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid #333;
            display: inline-block;
            margin-left: 5px;
        }
        .info-value .server-tag {
            color: var(--primary);
            font-weight: 700;
        }
        .info-value .recovery-tag {
            color: var(--gold);
            font-size: 0.8rem;
        }

        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; }
        .toast { background: var(--bg-input); border-left: 4px solid var(--primary); padding: 15px 20px; margin-bottom: 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; animation: slideIn 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-weight: 500; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        /* Loader */
        .loader { text-align: center; padding: 50px; color: var(--primary); font-family: var(--font-head); font-size: 1.5rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* ================================================================
           এডিট মোডাল (শুধুমাত্র প্রোফাইল থেকে এক্সেস, ডিটেইলস পেজে নাই)
           ================================================================ */
        /* ডিটেইলস পেজে এডিট/ডিলিট বাটন থাকবে না */
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow-orb"></div>
    <div class="toast-container" id="toastContainer"></div>

    <nav class="navbar">
        <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <span class="nav-title">POST DETAILS</span>
    </nav>

    <div class="container" id="mainContent">
        <div class="loader"><i class="fas fa-circle-notch fa-spin"></i> LOADING DATA...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAS3UXXrio_-c9uPbHwpDuTVrP-p8d903w",
            authDomain: "white-2k-17-v4.firebaseapp.com",
            databaseURL: "https://white-2k-17-v4-default-rtdb.firebaseio.com",
            projectId: "white-2k-17-v4",
            storageBucket: "white-2k-17-v4.firebasestorage.app",
            messagingSenderId: "180909174928",
            appId: "1:180909174928:android:148861a87d66c6980ca815"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const auth = firebase.auth();
        const DB_PATH = "MVX_VIP_SERVER_V5";

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        let postData = null;
        let currentUser = null;

        // ================================================================
        // টোস্ট
        // ================================================================
        function showToast(msg, type='success') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.style.borderLeftColor = type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas fa-${type==='error'?'times':'check'}-circle" style="color:${type==='error'?'var(--danger)':'var(--primary)'}"></i> <span>${msg}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 3000);
        }

        // ================================================================
        // Auth State
        // ================================================================
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (!postId) {
                document.getElementById('mainContent').innerHTML = `<div class="loader" style="color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> ERROR: POST ID NOT FOUND</div>`;
                return;
            }
            loadPostData();
        });

        // ================================================================
        // ডেটা লোড
        // ================================================================
        function loadPostData() {
            database.ref(`${DB_PATH}/${postId}`).once('value').then(snapshot => {
                if(!snapshot.exists()) {
                    document.getElementById('mainContent').innerHTML = `<div class="loader" style="color:var(--danger)"><i class="fas fa-search-minus"></i> ERROR: POST NOT FOUND</div>`;
                    return;
                }
                postData = snapshot.val();
                renderPage();
            }).catch(err => {
                document.getElementById('mainContent').innerHTML = `<div class="loader" style="color:var(--danger)"><i class="fas fa-wifi"></i> DATABASE ERROR</div>`;
            });
        }

        // ================================================================
        // রেন্ডার - লোগো ছাড়া, এডিট/ডিলিট ছাড়া, পরিষ্কার ফরম্যাট
        // ================================================================
        function renderPage() {
            const container = document.getElementById('mainContent');
            
            if (!postData) {
                container.innerHTML = `<div class="loader" style="color:var(--danger)">NO DATA</div>`;
                return;
            }

            // Ban Badge
            let banBadgeHTML = '';
            if (postData.isBanned === true) {
                banBadgeHTML = `<span class="ban-badge-detail banned"><i class="fas fa-ban"></i> BANNED</span>`;
            } else {
                banBadgeHTML = `<span class="ban-badge-detail noban"><i class="fas fa-check-circle"></i> NO BAN</span>`;
            }

            const imageSrc = postData.imageUrl || 'https://via.placeholder.com/800x450/1a1f2c/00e6b8?text=NO+IMAGE';
            
            // সময় ফরম্যাট
            const timeStr = postData.timestamp ? new Date(postData.timestamp).toLocaleString('en-US', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            }) : 'N/A';

            // সার্ভার
            const serverText = postData.server || 'N/A';

            // কন্টাক্ট টাইপ লেবেল
            const contactTypeLabels = {
                'facebook': 'Facebook',
                'gmail': 'Gmail',
                'twitter': 'Twitter',
                'phone': 'Phone'
            };
            const contactTypeLabel = contactTypeLabels[postData.contactType] || postData.contactType || 'N/A';

            // মেইন কন্টাক্ট
            const mainContact = postData.mainContact || postData.contactValue || 'N/A';

            // রিকভারি তথ্য
            let recoveryHTML = '';
            if (postData.recoveryPhone) {
                recoveryHTML += `<div class="info-row">
                    <span class="info-label"><i class="fas fa-sync"></i> Recovery Phone</span>
                    <span class="info-value"><span class="recovery-tag">${postData.recoveryPhone}</span></span>
                </div>`;
            }
            if (postData.recoveryEmail) {
                recoveryHTML += `<div class="info-row">
                    <span class="info-label"><i class="fas fa-sync"></i> Recovery Email</span>
                    <span class="info-value"><span class="recovery-tag">${postData.recoveryEmail}</span></span>
                </div>`;
            }

            container.innerHTML = `
                <!-- Header: শুধু টাইটেল + মেটা -->
                <div class="post-header">
                    <h1 class="post-title">${postData.title || 'Untitled'}</h1>
                    <div class="post-meta">
                        <span class="meta-tag"><i class="fas fa-tag"></i> ${postData.gameCategory || 'N/A'}</span>
                        <span class="meta-tag"><i class="fas fa-clock"></i> ${timeStr}</span>
                        <span class="meta-tag"><i class="fas fa-globe"></i> ${serverText}</span>
                        ${banBadgeHTML}
                    </div>
                </div>

                <!-- ইমেজ -->
                <div class="image-section">
                    <div class="section-title"><i class="fas fa-image"></i> PREVIEW</div>
                    <img src="${imageSrc}" class="main-image" alt="Post Image">
                </div>

                <!-- ডিটেলস - পরিষ্কার ফরম্যাট -->
                <div class="info-section">
                    <div class="section-title"><i class="fas fa-info-circle"></i> DETAILS</div>
                    
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
                        <span class="info-value">${postData.email || 'N/A'}</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-phone"></i> Main Contact</span>
                        <span class="info-value">
                            ${mainContact} 
                            <span class="contact-type-badge">${contactTypeLabel}</span>
                        </span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-globe"></i> Server</span>
                        <span class="info-value"><span class="server-tag">${serverText}</span></span>
                    </div>

                    ${recoveryHTML}
                    
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-shield-alt"></i> Status</span>
                        <span class="info-value">${postData.isBanned === true ? '🚫 BANNED' : '✅ ACTIVE'}</span>
                    </div>
                </div>
            `;
        }

        // ================================================================
        // মোডালের বাইরে ক্লিক করলে বন্ধ (কোন মোডাল নেই)
        // ================================================================
        // ডিটেইলস পেজে এডিট/ডিলিট বাটন থাকবে না
    </script>
</body>
</html>
