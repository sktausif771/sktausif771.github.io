<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e6b8">
    <title>Post Details | MVX STORE v4.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* ==========================================================================
           MVX STORE V4.0 - POST DETAILS PAGE (UPDATED)
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #00e6b8; --primary-dim: rgba(0, 230, 184, 0.15);
            --gold: #ffd700; --gold-dim: rgba(255, 215, 0, 0.15);
            --danger: #ff003c; --danger-dim: rgba(255, 0, 60, 0.15);
            --bg-void: #000000; --bg-card: #0c101a; --bg-input: #1a1f2c;
            --text-primary: #ffffff; --text-muted: #9ca3af;
            --glass-bg: rgba(8, 11, 18, 0.8); --glass-border: 1px solid rgba(0, 230, 184, 0.2);
            --font-head: 'Rajdhani', sans-serif; --font-body: 'Space Grotesk', sans-serif;
        }

        body { background: var(--bg-void); color: var(--text-primary); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

        /* Background Effects */
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 230, 184, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 230, 184, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: -1; }
        .glow-orb { position: fixed; width: 50vmax; height: 50vmax; border-radius: 50%; background: radial-gradient(circle at center, rgba(0, 230, 184, 0.1) 0%, transparent 70%); filter: blur(50px); pointer-events: none; z-index: -1; top: -10vmax; right: -10vmax; }

        /* Navigation Bar */
        .navbar { position: sticky; top: 0; background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: var(--glass-border); height: 60px; display: flex; align-items: center; padding: 0 20px; z-index: 100; gap: 15px; }
        .back-btn { background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { color: var(--primary); }
        .nav-title { font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }

        /* Main Container */
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Post Header Info */
        .post-header { display: flex; gap: 20px; align-items: center; margin-bottom: 30px; background: var(--bg-card); padding: 20px; border-radius: 16px; border: var(--glass-border); }
        .post-image { width: 90px; height: 90px; border-radius: 20px; object-fit: cover; border: 2px solid var(--primary-dim); background: var(--bg-input); }
        .post-info { flex: 1; }
        .post-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; color: var(--primary); }
        .post-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.9rem; color: var(--text-muted); font-family: 'Share Tech Mono', monospace; }
        .meta-tag { background: var(--bg-input); padding: 5px 10px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; gap: 5px; }

        /* Ban Badge */
        .ban-badge-detail {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .ban-badge-detail.banned {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 20px var(--danger-dim);
        }
        .ban-badge-detail.noban {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary-dim);
        }

        /* Image Section */
        .image-section { margin-bottom: 30px; }
        .section-title { font-family: var(--font-head); font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
        .main-image { width: 100%; border-radius: 12px; border: var(--glass-border); background: var(--bg-card); }

        /* Info Section */
        .info-section { background: var(--bg-card); padding: 25px 20px; border-radius: 16px; border: var(--glass-border); margin-bottom: 30px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); font-weight: 500; }
        .info-value { color: var(--text-primary); font-weight: 600; }

        /* Action Buttons */
        .action-section { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .action-btn { padding: 12px 25px; border-radius: 10px; border: none; font-family: var(--font-head); font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .action-btn.edit { background: var(--primary); color: #000; }
        .action-btn.edit:hover { box-shadow: 0 0 20px var(--primary-dim); transform: translateY(-2px); }
        .action-btn.delete { background: var(--danger); color: #fff; }
        .action-btn.delete:hover { box-shadow: 0 0 20px var(--danger-dim); transform: translateY(-2px); }

        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; }
        .toast { background: var(--bg-input); border-left: 4px solid var(--primary); padding: 15px 20px; margin-bottom: 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; animation: slideIn 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-weight: 500; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        /* Loader */
        .loader { text-align: center; padding: 50px; color: var(--primary); font-family: var(--font-head); font-size: 1.5rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* ================================================================
           এডিট মোডাল (details পেজে)
           ================================================================ */
        .edit-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .edit-modal-overlay.active {
            display: flex;
        }
        .edit-modal-box {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 50px var(--primary-dim);
            animation: fadeIn 0.4s ease;
        }
        .edit-modal-box h2 {
            color: var(--primary);
            font-family: var(--font-head);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            font-size: 1.3rem;
        }
        .edit-modal-box .close-edit-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            margin-left: auto;
            transition: 0.3s;
        }
        .edit-modal-box .close-edit-btn:hover {
            color: var(--danger);
        }
        .edit-form-group {
            margin-bottom: 15px;
        }
        .edit-form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .edit-form-group input,
        .edit-form-group select,
        .edit-form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .edit-form-group input:focus,
        .edit-form-group select:focus,
        .edit-form-group textarea:focus {
            border-color: var(--primary);
        }
        .edit-form-group textarea {
            min-height: 60px;
            resize: vertical;
        }

        .edit-ban-options {
            display: flex;
            gap: 15px;
            margin: 5px 0 10px 0;
        }
        .edit-ban-option-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-head);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .edit-ban-option-btn.active-no-ban {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
        }
        .edit-ban-option-btn.active-ban {
            border-color: var(--danger);
            background: var(--danger-dim);
            color: var(--danger);
        }

        .edit-contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 5px 0 10px 0;
        }
        .edit-contact-btn {
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .edit-contact-btn.active-contact {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
        }

        .edit-submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .edit-submit-btn:hover {
            box-shadow: 0 0 20px var(--primary-dim);
            transform: translateY(-2px);
        }

        .edit-other-game-box {
            display: none;
            margin-top: 10px;
        }
        .edit-other-game-box.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow-orb"></div>
    <div class="toast-container" id="toastContainer"></div>

    <nav class="navbar">
        <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <span class="nav-title">POST DETAILS</span>
    </nav>

    <div class="container" id="mainContent">
        <div class="loader"><i class="fas fa-circle-notch fa-spin"></i> LOADING DATA...</div>
    </div>

    <!-- ============================================================
    এডিট মোডাল (details পেজে)
    ============================================================ -->
    <div class="edit-modal-overlay" id="editModal">
        <div class="edit-modal-box">
            <h2>
                <i class="fas fa-edit"></i> EDIT POST
                <button class="close-edit-btn" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </h2>

            <form id="editForm" onsubmit="submitEdit(event)">
                <input type="hidden" id="editPostId">

                <div class="edit-form-group">
                    <label>Ban Status</label>
                    <div class="edit-ban-options">
                        <button type="button" class="edit-ban-option-btn active-no-ban" id="editBanNo" onclick="selectEditBan('no')">
                            <i class="fas fa-check-circle" style="color: var(--primary);"></i> No Ban
                        </button>
                        <button type="button" class="edit-ban-option-btn" id="editBanYes" onclick="selectEditBan('yes')">
                            <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i> Ban
                        </button>
                    </div>
                    <input type="hidden" id="editBanStatus" value="no">
                </div>

                <div class="edit-form-group">
                    <label>Title *</label>
                    <input type="text" id="editTitle" required>
                </div>

                <div class="edit-form-group">
                    <label>Game Category *</label>
                    <select id="editCategory" onchange="toggleEditOtherGame()">
                        <option value="Free Fire">Free Fire</option>
                        <option value="PUBG">PUBG</option>
                        <option value="Blood Strike">Blood Strike</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="edit-other-game-box" id="editOtherGameBox">
                    <div class="edit-form-group">
                        <label>Other Game Name</label>
                        <input type="text" id="editOtherGame" placeholder="Enter game name...">
                    </div>
                </div>

                <div class="edit-form-group">
                    <label>Email Address *</label>
                    <input type="email" id="editEmail" required>
                </div>

                <div class="edit-form-group">
                    <label>Contact Type</label>
                    <div class="edit-contact-grid">
                        <button type="button" class="edit-contact-btn active-contact" id="editContactFacebook" onclick="selectEditContact('facebook')">
                            <i class="fab fa-facebook"></i> Facebook
                        </button>
                        <button type="button" class="edit-contact-btn" id="editContactGmail" onclick="selectEditContact('gmail')">
                            <i class="fas fa-envelope"></i> Gmail
                        </button>
                        <button type="button" class="edit-contact-btn" id="editContactTwitter" onclick="selectEditContact('twitter')">
                            <i class="fab fa-twitter"></i> Twitter
                        </button>
                        <button type="button" class="edit-contact-btn" id="editContactPhone" onclick="selectEditContact('phone')">
                            <i class="fas fa-phone"></i> Phone
                        </button>
                    </div>
                    <input type="hidden" id="editContactType" value="facebook">
                </div>

                <div class="edit-form-group">
                    <label>Phone/Email *</label>
                    <input type="text" id="editContactValue" required>
                </div>

                <button type="submit" class="edit-submit-btn">
                    <i class="fas fa-save"></i> UPDATE POST
                </button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAS3UXXrio_-c9uPbHwpDuTVrP-p8d903w",
            authDomain: "white-2k-17-v4.firebaseapp.com",
            databaseURL: "https://white-2k-17-v4-default-rtdb.firebaseio.com",
            projectId: "white-2k-17-v4",
            storageBucket: "white-2k-17-v4.firebasestorage.app",
            messagingSenderId: "180909174928",
            appId: "1:180909174928:android:148861a87d66c6980ca815"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const auth = firebase.auth();
        const DB_PATH = "MVX_VIP_SERVER_V5";

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        let postData = null;
        let currentUser = null;

        // ================================================================
        // টোস্ট
        // ================================================================
        function showToast(msg, type='success') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.style.borderLeftColor = type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.innerHTML = `<i class="fas fa-${type==='error'?'times':'check'}-circle" style="color:${type==='error'?'var(--danger)':'var(--primary)'}"></i> <span>${msg}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 3000);
        }

        // ================================================================
        // Auth State
        // ================================================================
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (!postId) {
                document.getElementById('mainContent').innerHTML = `<div class="loader" style="color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> ERROR: POST ID NOT FOUND</div>`;
                return;
            }
            loadPostData();
        });

        // ================================================================
        // ডেটা লোড
        // ================================================================
        function loadPostData() {
            database.ref(`${DB_PATH}/${postId}`).once('value').then(snapshot => {
                if(!snapshot.exists()) {
                    document.getElementById('mainContent').innerHTML = `<div class="loader" style="color:var(--danger)"><i class="fas fa-search-minus"></i> ERROR: POST NOT FOUND</div>`;
                    return;
                }
                postData = snapshot.val();
                renderPage();
            }).catch(err => {
                document.getElementById('mainContent').innerHTML = `<div class="loader" style="color:var(--danger)"><i class="fas fa-wifi"></i> DATABASE ERROR</div>`;
            });
        }

        // ================================================================
        // রেন্ডার
        // ================================================================
        function renderPage() {
            const container = document.getElementById('mainContent');
            
            if (!postData) {
                container.innerHTML = `<div class="loader" style="color:var(--danger)">NO DATA</div>`;
                return;
            }

            const isOwner = currentUser && postData.uid === currentUser.uid;

            // Ban Badge
            let banBadgeHTML = '';
            if (postData.isBanned === true) {
                banBadgeHTML = `<span class="ban-badge-detail banned"><i class="fas fa-ban"></i> BANNED</span>`;
            } else {
                banBadgeHTML = `<span class="ban-badge-detail noban"><i class="fas fa-check-circle"></i> NO BAN</span>`;
            }

            // Action Buttons (শুধু মালিক দেখতে পাবে)
            let actionHTML = '';
            if (isOwner) {
                actionHTML = `
                    <div class="action-section">
                        <button class="action-btn edit" onclick="openEditModal()">
                            <i class="fas fa-edit"></i> EDIT POST
                        </button>
                        <button class="action-btn delete" onclick="deletePost()">
                            <i class="fas fa-trash"></i> DELETE POST
                        </button>
                    </div>
                `;
            }

            const imageSrc = postData.imageUrl || 'https://via.placeholder.com/800x450/1a1f2c/00e6b8?text=NO+IMAGE';
            const timeStr = postData.timestamp ? new Date(postData.timestamp).toLocaleString() : 'N/A';

            container.innerHTML = `
                <div class="post-header">
                    <img src="${imageSrc}" class="post-image" alt="Post Image">
                    <div class="post-info">
                        <h1 class="post-title">${postData.title || 'Untitled'}</h1>
                        <div class="post-meta">
                            <span class="meta-tag"><i class="fas fa-tag"></i> ${postData.gameCategory || 'N/A'}</span>
                            <span class="meta-tag"><i class="fas fa-clock"></i> ${timeStr}</span>
                            ${banBadgeHTML}
                        </div>
                    </div>
                </div>

                <div class="image-section">
                    <div class="section-title"><i class="fas fa-image"></i> PREVIEW</div>
                    <img src="${imageSrc}" class="main-image" alt="Post Image">
                </div>

                <div class="info-section">
                    <div class="section-title"><i class="fas fa-info-circle"></i> DETAILS</div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
                        <span class="info-value">${postData.email || 'N/A'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-phone"></i> Contact</span>
                        <span class="info-value">${postData.contactValue || 'N/A'} 
                            <span style="font-size:0.8rem;color:var(--text-muted);">(${postData.contactType || 'N/A'})</span>
                        </span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-user"></i> Posted By</span>
                        <span class="info-value">${postData.userEmail || 'Unknown'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fas fa-shield-alt"></i> Status</span>
                        <span class="info-value">${postData.isBanned === true ? '🚫 BANNED' : '✅ ACTIVE'}</span>
                    </div>
                </div>

                ${actionHTML}
            `;
        }

        // ================================================================
        // ডিলিট ফাংশন
        // ================================================================
        function deletePost() {
            if (!currentUser || !postData || postData.uid !== currentUser.uid) {
                showToast('You cannot delete this post!', 'error');
                return;
            }

            if (confirm('Are you sure you want to delete this post?')) {
                database.ref(`${DB_PATH}/${postId}`).remove()
                    .then(() => {
                        showToast('✅ Post deleted successfully!');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    })
                    .catch(err => showToast('Error: ' + err.message, 'error'));
            }
        }

        // ================================================================
        // এডিট মোডাল
        // ================================================================
        function openEditModal() {
            if (!currentUser || !postData || postData.uid !== currentUser.uid) {
                showToast('You cannot edit this post!', 'error');
                return;
            }

            document.getElementById('editPostId').value = postId;
            document.getElementById('editTitle').value = postData.title || '';
            document.getElementById('editCategory').value = postData.gameCategory || 'Free Fire';
            document.getElementById('editEmail').value = postData.email || '';
            document.getElementById('editContactValue').value = postData.contactValue || '';

            // Ban status
            const isBanned = postData.isBanned === true;
            selectEditBan(isBanned ? 'yes' : 'no');

            // Contact type
            selectEditContact(postData.contactType || 'facebook');

            // Other game
            if (postData.gameCategory === 'Others') {
                document.getElementById('editOtherGameBox').classList.add('show');
                document.getElementById('editOtherGame').value = postData.gameCategory || '';
            } else {
                document.getElementById('editOtherGameBox').classList.remove('show');
            }

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function selectEditBan(type) {
            const noBtn = document.getElementById('editBanNo');
            const yesBtn = document.getElementById('editBanYes');
            const hiddenInput = document.getElementById('editBanStatus');

            noBtn.classList.remove('active-no-ban', 'active-ban');
            yesBtn.classList.remove('active-no-ban', 'active-ban');

            if (type === 'no') {
                noBtn.classList.add('active-no-ban');
                hiddenInput.value = 'no';
            } else {
                yesBtn.classList.add('active-ban');
                hiddenInput.value = 'yes';
            }
        }

        function selectEditContact(type) {
            const btns = document.querySelectorAll('.edit-contact-btn');
            btns.forEach(btn => btn.classList.remove('active-contact'));
            
            const map = {
                'facebook': 'editContactFacebook',
                'gmail': 'editContactGmail',
                'twitter': 'editContactTwitter',
                'phone': 'editContactPhone'
            };
            
            document.getElementById(map[type]).classList.add('active-contact');
            document.getElementById('editContactType').value = type;
        }

        function toggleEditOtherGame() {
            const val = document.getElementById('editCategory').value;
            const box = document.getElementById('editOtherGameBox');
            if (val === 'Others') {
                box.classList.add('show');
            } else {
                box.classList.remove('show');
            }
        }

        // ================================================================
        // এডিট সাবমিট
        // ================================================================
        function submitEdit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.edit-submit-btn');

            const category = document.getElementById('editCategory').value;
            let gameCategory = category;
            if (category === 'Others') {
                gameCategory = document.getElementById('editOtherGame').value.trim() || 'Others';
            }

            const data = {
                title: document.getElementById('editTitle').value.trim(),
                gameCategory: gameCategory,
                email: document.getElementById('editEmail').value.trim(),
                contactType: document.getElementById('editContactType').value,
                contactValue: document.getElementById('editContactValue').value.trim(),
                isBanned: document.getElementById('editBanStatus').value === 'yes' ? true : false,
                isUpdated: true,
                timestamp: Date.now()
            };

            if (!data.title || !data.email || !data.contactValue) {
                showToast('Please fill all required fields!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPDATING...';

            database.ref(`${DB_PATH}/${postId}`).update(data)
                .then(() => {
                    showToast('✅ Post updated successfully!');
                    closeEditModal();
                    btn.innerHTML = '<i class="fas fa-save"></i> UPDATE POST';
                    btn.disabled = false;
                    // রিফ্রেশ
                    loadPostData();
                })
                .catch(err => {
                    showToast('Error: ' + err.message, 'error');
                    btn.innerHTML = '<i class="fas fa-save"></i> UPDATE POST';
                    btn.disabled = false;
                });
        }

        // ================================================================
        // মোডালের বাইরে ক্লিক করলে বন্ধ
        // ================================================================
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
