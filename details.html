<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>App Details | MVX STORE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* ==========================================================================
           APP DETAILS PAGE ARCHITECTURE V4.0
           ========================================================================== */
        
        /* Navbar specific for Details page */
        .details-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 65px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 230, 184, 0.15);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000;
        }
        .btn-back {
            color: #f8fafc; font-size: 20px; cursor: pointer;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05); border-radius: 50%; transition: 0.3s;
            text-decoration: none;
        }
        .btn-back:hover { background: #00e6b8; color: #020617; }
        .nav-title { font-family: 'Orbitron', sans-serif; color: #00e6b8; font-size: 16px; font-weight: 700; letter-spacing: 1px;}
        .btn-report { color: #ff003c; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-report:hover { transform: scale(1.1); text-shadow: 0 0 15px rgba(255,0,60,0.5); }

        /* Main Content Container */
        .details-wrapper { padding: 85px 20px 100px 20px; max-width: 800px; margin: 0 auto; }

        /* Banner & Header Section */
        .app-header { position: relative; margin-bottom: 25px; border-radius: 16px; overflow: hidden; background: #0f172a; border: 1px solid rgba(255,255,255,0.05); }
        .banner-img { width: 100%; height: 220px; object-fit: cover; opacity: 0.6; }
        .header-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(0deg, #0f172a 10%, transparent 100%); display: flex; align-items: flex-end; gap: 20px; }
        .app-logo { width: 90px; height: 90px; border-radius: 20px; border: 3px solid #00e6b8; box-shadow: 0 10px 20px rgba(0,0,0,0.5); background: #020617; object-fit: cover; }
        
        .app-title-box h1 { font-family: 'Orbitron', sans-serif; font-size: 22px; color: #ffffff; margin-bottom: 5px; }
        .uploader-info { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
        .uploader-info i { color: #00e6b8; }
        .verified-badge { color: #00e6b8; font-size: 14px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-box { background: rgba(0,230,184,0.05); border: 1px solid rgba(0,230,184,0.1); padding: 15px 10px; border-radius: 12px; text-align: center; }
        .stat-box i { font-size: 18px; color: #00e6b8; margin-bottom: 8px; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; color: #ffffff; display: block; }
        .stat-label { font-family: 'Space Grotesk', sans-serif; font-size: 11px; color: #94a3b8; text-transform: uppercase; }

        /* Action Buttons */
        .action-row { display: flex; gap: 15px; margin-bottom: 30px; }
        .btn-download { flex: 1; background: #00e6b8; color: #020617; padding: 16px; border: none; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,230,184,0.2); }
        .btn-download:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,230,184,0.4); background: #ffffff; }
        
        .btn-share { width: 55px; background: rgba(255,255,255,0.05); color: #00e6b8; border: 1px solid rgba(0,230,184,0.2); border-radius: 12px; font-size: 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-share:hover { background: rgba(0,230,184,0.1); color: #ffffff; }

        /* Description & Content */
        .content-section { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        .section-heading { font-family: 'Orbitron', sans-serif; font-size: 16px; color: #ffffff; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .section-heading i { color: #00e6b8; }
        
        .app-description { font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #cbd5e1; line-height: 1.7; white-space: pre-wrap; }

        /* Screenshots Wrapper */
        .screenshots-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .screenshots-container::-webkit-scrollbar { height: 6px; }
        .screenshots-container::-webkit-scrollbar-thumb { background: #00e6b8; border-radius: 10px; }
        .screenshot-img { height: 250px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); scroll-snap-align: start; object-fit: cover; }

        /* Loader */
        #detailsLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020617; display: flex; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; }
        .loader-ring { width: 50px; height: 50px; border: 3px solid rgba(0,230,184,0.2); border-top-color: #00e6b8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="detailsLoader">
        <div class="loader-ring"></div>
        <div style="color:#00e6b8; font-family:'Orbitron', sans-serif; letter-spacing: 2px;">FETCHING SECURE DATA...</div>
    </div>

    <nav class="details-nav">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i></a>
        <div class="nav-title">APP DETAILS</div>
        <i class="fas fa-shield-alt btn-report" title="Report this App" id="reportBtn"></i>
    </nav>

    <main class="details-wrapper">
        
        <div class="app-header">
            <img src="" alt="Banner" class="banner-img" id="appBanner">
            <div class="header-overlay">
                <img src="" alt="Logo" class="app-logo" id="appLogo">
                <div class="app-title-box">
                    <h1 id="appName">Loading App...</h1>
                    <div class="uploader-info">
                        <i class="fas fa-user-astronaut"></i> 
                        <span id="uploaderName">Unknown User</span>
                        <i class="fas fa-check-circle verified-badge" style="display: none;" id="verifiedIcon"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <i class="fas fa-eye"></i>
                <span class="stat-value" id="viewCount">0</span>
                <span class="stat-label">Views</span>
            </div>
            <div class="stat-box">
                <i class="fas fa-cloud-download-alt"></i>
                <span class="stat-value" id="downloadCount">0</span>
                <span class="stat-label">Downloads</span>
            </div>
            <div class="stat-box">
                <i class="fas fa-hdd"></i>
                <span class="stat-value" id="appSize">--</span>
                <span class="stat-label">Size</span>
            </div>
            <div class="stat-box">
                <i class="fas fa-code-branch"></i>
                <span class="stat-value" id="appVersion">v1.0</span>
                <span class="stat-label">Version</span>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-download" id="downloadBtn">
                <i class="fas fa-download"></i> GET APPLICATION
            </button>
            <button class="btn-share" id="shareBtn" title="Copy Deep Link">
                <i class="fas fa-link"></i>
            </button>
        </div>

        <div class="content-section">
            <h3 class="section-heading"><i class="fas fa-align-left"></i> About Application</h3>
            <div class="app-description" id="appDesc">
                Fetching details from server...
            </div>
        </div>

        <div class="content-section" id="screenshotSection" style="display: none;">
            <h3 class="section-heading"><i class="fas fa-images"></i> Visual Interface</h3>
            <div class="screenshots-container" id="screenshotContainer">
                </div>
        </div>

    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="firebase-config.js"></script>
    <script src="main.js"></script>
    <script src="store-logic.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get('id');

            if (!appId) {
                alert("Invalid Access: No Application ID found.");
                window.location.replace("index.html");
                return;
            }

            // Share Button Logic (Deep Linking)
            document.getElementById('shareBtn').addEventListener('click', () => {
                const currentUrl = window.location.href;
                navigator.clipboard.writeText(currentUrl).then(() => {
                    alert("Application link copied to clipboard!");
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                });
            });

            // Trigger Fetch Logic from store-logic.js
            setTimeout(() => {
                if(typeof window.fetchAppDetails === 'function') {
                    window.fetchAppDetails(appId);
                } else {
                    document.getElementById('detailsLoader').innerHTML = `
                        <div style="color:#ff003c; text-align:center; padding: 20px;">
                            <i class="fas fa-exclamation-triangle" style="font-size:40px; margin-bottom:15px;"></i>
                            <h3>SYSTEM ERROR</h3>
                            <p style="font-size:12px; margin-top:10px;">store-logic.js is missing or loading failed.</p>
                            <button onclick="window.location.href='index.html'" style="margin-top:20px; padding:10px 20px; background:#00e6b8; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">RETURN HOME</button>
                        </div>
                    `;
                }
            }, 1000);

            // Report Button Logic
            document.getElementById('reportBtn').addEventListener('click', () => {
                const reason = prompt("Enter reason for reporting (e.g., Fake, Virus, Broken Link):");
                if(reason && reason.trim() !== "") {
                    if(typeof window.submitAppReport === 'function') {
                        window.submitAppReport(appId, reason);
                    } else {
                        alert("Report functionality is currently initializing. Please try again.");
                    }
                }
            });
        });
    </script>
</body>
</html>
