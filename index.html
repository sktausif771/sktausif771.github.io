<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e6b8">
    <title>ACCOUNT SAVING | MVX STORE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #00e6b8; --primary-dim: rgba(0, 230, 184, 0.15);
            --gold: #ffd700; --gold-dim: rgba(255, 215, 0, 0.15);
            --danger: #ff003c; --danger-dim: rgba(255, 0, 60, 0.15);
            --bg-void: #000000; --bg-card: #0c101a; --bg-input: #1a1f2c;
            --text-primary: #ffffff; --text-muted: #9ca3af;
            --glass-bg: rgba(8, 11, 18, 0.8); --glass-border: 1px solid rgba(0, 230, 184, 0.2);
            --font-head: 'Rajdhani', sans-serif; --font-body: 'Space Grotesk', sans-serif;
        }

        body { background: var(--bg-void); color: var(--text-primary); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

        /* Background Effects */
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 230, 184, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 230, 184, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: -1; animation: gridShift 15s linear infinite; }
        .glow-orb { position: fixed; width: 60vmax; height: 60vmax; border-radius: 50%; background: radial-gradient(circle at center, rgba(0, 230, 184, 0.1) 0%, transparent 70%); filter: blur(50px); pointer-events: none; z-index: -1; top: -20vmax; left: -20vmax; animation: orbFloat 20s ease-in-out infinite alternate; }
        @keyframes gridShift { 0% { background-position: 0 0; } 100% { background-position: 50px 50px; } }
        @keyframes orbFloat { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(10%,10%) scale(1.2); } }

        /* ================================================================
           🔐 LOGIN OVERLAY
           ================================================================ */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-void);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loginOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-overlay-box {
            text-align: center;
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 0 60px var(--primary-dim);
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-overlay-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 30px var(--primary-dim);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .login-overlay-sub {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .login-overlay-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 20px var(--primary-dim); transform: scale(1); }
            50% { text-shadow: 0 0 50px var(--primary); transform: scale(1.05); }
        }

        .login-input-group {
            margin-bottom: 18px;
            text-align: left;
            position: relative;
        }
        .login-input-group i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .login-input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .login-input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-dim);
        }

        .login-overlay-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: var(--font-head);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }
        .login-overlay-btn:hover {
            box-shadow: 0 0 30px var(--primary);
            transform: translateY(-2px);
        }

        .login-overlay-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #555;
            font-size: 0.9rem;
        }
        .login-overlay-divider::before,
        .login-overlay-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
            margin: 0 10px;
        }

        .login-google-btn {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-google-btn:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255,255,255,0.1);
        }
        .google-icon {
            width: 20px;
            height: 20px;
        }

        .login-overlay-footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.6;
            font-family: 'Share Tech Mono', monospace;
        }

        .login-error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            font-weight: 600;
        }

        /* Header */
        .header { position: sticky; top: 0; background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: var(--glass-border); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn, .search-btn { font-size: 1.5rem; color: var(--text-primary); cursor: pointer; background: none; border: none; }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: #080b12; border-right: var(--glass-border); z-index: 1000; transition: 0.3s; padding: 20px; overflow-y: auto; }
        .sidebar.active { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; display: none; }
        .overlay.active { display: block; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        
        .sidebar-logo { text-align: center; margin-bottom: 30px; margin-top: 20px; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--primary); }
        .sidebar-menu a { display: flex; align-items: center; gap: 15px; padding: 15px; color: var(--text-primary); text-decoration: none; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; cursor: pointer; font-weight: 600; font-family: var(--font-head); font-size: 1.1rem;}
        .sidebar-menu a:hover { background: var(--bg-input); color: var(--primary); }
        
        .login-redirect-btn { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;}
        .login-redirect-btn:hover { box-shadow: 0 0 15px var(--primary-dim); }

        /* Main Nav Tabs - সরিয়ে ফেলা হয়েছে */
        .main-tabs { display: none; }
        .sub-categories { display: none; }

        /* Search Bar */
        .search-container { padding: 15px 20px; display: none; }
        .search-box { width: 100%; background: var(--bg-input); border: var(--glass-border); border-radius: 8px; padding: 12px 15px; color: #fff; font-size: 1rem; outline: none; }

        /* Feed System (App Cards) */
        .feed-container { max-width: 800px; margin: 0 auto; padding: 20px; padding-bottom: 100px; display: flex; flex-direction: column; gap: 30px; }
        .yt-card { display: flex; flex-direction: column; cursor: pointer; transition: 0.3s; position: relative; }
        .yt-card:hover { transform: translateY(-5px); }
        .yt-banner-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg-input); border: var(--glass-border); }
        .yt-banner { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .yt-card:hover .yt-banner { transform: scale(1.05); }
        
        /* ========== BAN BADGE (লাল) ========== */
        .ban-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--danger);
            color: #fff;
            padding: 5px 14px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px var(--danger-dim);
            z-index: 2;
            animation: banPulse 2s infinite;
        }
        @keyframes banPulse {
            0%, 100% { box-shadow: 0 0 10px var(--danger-dim); }
            50% { box-shadow: 0 0 30px var(--danger); }
        }

        .noban-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--primary);
            color: #000;
            padding: 5px 14px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px var(--primary-dim);
            z-index: 2;
        }

        /* সার্ভার ব্যাজ - ছোট করে */
        .server-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: var(--font-head);
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }

        .type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }
        .type-badge.Free { background: var(--primary); color: #000; }
        .type-badge.Premium { background: var(--gold); color: #000; }
        .type-badge.Paid { background: var(--danger); color: #fff; }

        .badge-update { position: absolute; top: 10px; left: 10px; background: var(--danger); color: #fff; padding: 5px 12px; border-radius: 5px; font-size: 0.8rem; font-family: var(--font-head); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 10px var(--danger-dim); z-index: 2; }

        .yt-info { display: flex; gap: 15px; margin-top: 15px; align-items: flex-start; }
        .yt-logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: var(--bg-input); border: 1px solid #333; }
        .yt-text { flex: 1; }
        .yt-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; color: var(--text-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .yt-meta { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; }

        /* Load More */
        .load-more-container { text-align: center; margin: 20px 0 50px; width: 100%; display: none; }
        .btn-load-more { background: var(--bg-input); border: 1px solid var(--primary); color: var(--primary); padding: 12px 30px; border-radius: 8px; font-family: var(--font-head); font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-load-more:hover { background: var(--primary-dim); box-shadow: 0 0 15px var(--primary-dim); }

        /* Custom Admin Password Modal */
        .pass-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .pass-modal { background: var(--bg-card); padding: 25px; border-radius: 15px; border: 1px solid var(--primary); text-align: center; width: 90%; max-width: 350px; box-shadow: 0 0 30px var(--primary-dim); }
        .pass-modal h3 { color: var(--primary); font-family: var(--font-head); margin-bottom: 15px; }
        .pass-modal input { width: 100%; background: var(--bg-input); border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 20px; outline: none; font-size: 1rem; text-align: center; letter-spacing: 3px; }
        .pass-modal input:focus { border-color: var(--primary); }
        .pass-btns { display: flex; gap: 10px; }
        .pass-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-cancel { background: #333; color: #fff; }
        .btn-verify { background: var(--primary); color: #000; }
        .btn-verify:hover { box-shadow: 0 0 15px var(--primary-dim); }

        /* Local Toast */
        .local-toast { position: fixed; top: 80px; right: 20px; background: var(--bg-input); border-left: 4px solid var(--primary); padding: 15px 20px; border-radius: 8px; display: none; gap: 10px; align-items: center; color: #fff; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-weight: 500;}
        
        .spinner { display: none; }
        .btn-loading .spinner { display: inline-block; animation: spin 1s linear infinite; }
        .btn-loading .btn-text { display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ================================================================
           অ্যাডমিন প্যানেল হাইড
           ================================================================ */
        .admin-panel-hidden {
            display: none !important;
        }

        /* ================================================================
           ফ্লোটিং প্লাস বাটন
           ================================================================ */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
        }
        .fab-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--primary);
            color: #000;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 230, 184, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 30px rgba(0, 230, 184, 0.6);
        }
        .fab-btn i {
            transition: transform 0.3s ease;
        }
        .fab-btn.open i {
            transform: rotate(45deg);
        }

        /* ================================================================
           আপলোড মোডাল
           ================================================================ */
        .upload-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .upload-modal-overlay.active {
            display: flex;
        }
        .upload-modal-box {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 50px var(--primary-dim);
            animation: fadeInUp 0.4s ease;
        }
        .upload-modal-box h2 {
            color: var(--primary);
            font-family: var(--font-head);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            font-size: 1.3rem;
        }
        .upload-modal-box .close-modal-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            margin-left: auto;
            transition: 0.3s;
        }
        .upload-modal-box .close-modal-btn:hover {
            color: var(--danger);
        }

        .upload-form-group {
            margin-bottom: 15px;
        }
        .upload-form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .upload-form-group input,
        .upload-form-group select,
        .upload-form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .upload-form-group input:focus,
        .upload-form-group select:focus,
        .upload-form-group textarea:focus {
            border-color: var(--primary);
        }
        .upload-form-group textarea {
            min-height: 60px;
            resize: vertical;
        }

        /* BAN অপশন */
        .ban-options {
            display: flex;
            gap: 15px;
            margin: 5px 0 10px 0;
        }
        .ban-option-btn {
            flex: 1;
            padding: 12px 10px;
            border-radius: 10px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-head);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .ban-option-btn:hover {
            border-color: var(--text-muted);
        }
        .ban-option-btn.active-no-ban {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
            box-shadow: 0 0 20px var(--primary-dim);
        }
        .ban-option-btn.active-ban {
            border-color: var(--danger);
            background: var(--danger-dim);
            color: var(--danger);
            box-shadow: 0 0 20px var(--danger-dim);
        }
        .ban-option-btn .ban-icon {
            margin-right: 8px;
        }

        /* সার্ভার সিলেক্ট */
        .server-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 5px 0 10px 0;
        }
        .server-option-btn {
            padding: 8px 5px;
            border-radius: 8px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .server-option-btn:hover {
            border-color: var(--text-muted);
        }
        .server-option-btn.active-server {
            border-color: var(--primary);
            background: var(--primary-dim);
            color: var(--primary);
        }

        .server-other-box {
            display: none;
            margin-top: 10px;
        }
        .server-other-box.show {
            display: block;
        }

        /* কাস্টম ইমেজ আপলোড */
        .custom-file-upload {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .custom-file-upload input[type="file"] {
            display: none;
        }
        .custom-file-label {
            flex: 1;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .custom-file-label:hover {
            border-color: var(--primary);
        }
        .custom-file-label.has-image {
            border-color: var(--primary);
            color: var(--primary);
        }
        .upload-preview-img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--primary);
            display: none;
        }
        .upload-preview-img.show {
            display: block;
        }

        .other-game-box {
            display: none;
            margin-top: 10px;
        }
        .other-game-box.show {
            display: block;
        }

        .contact-type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 5px 0 10px 0;
        }
        .contact-type-btn {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #333;
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .contact-type-btn:hover {
            border-color: var(--text-muted);
        }

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAS3UXXrio_-c9uPbHwpDuTVrP-p8d903w",
            authDomain: "white-2k-17-v4.firebaseapp.com",
            databaseURL: "https://white-2k-17-v4-default-rtdb.firebaseio.com",
            projectId: "white-2k-17-v4",
            storageBucket: "white-2k-17-v4.firebasestorage.app",
            messagingSenderId: "180909174928",
            appId: "1:180909174928:android:148861a87d66c6980ca815"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const auth = firebase.auth();
        const DB_PATH = "MVX_VIP_SERVER_V5";

        let allApps = [];
        let searchQuery = "";
        let targetAdminUrl = ""; 
        let currentLoggedUser = null;
        let displayLimit = 10;

        const ADMIN_EMAIL = "sktausif771@gmail.com";
        const IMGBB_API_KEY = "820eb9aa6a57f863045a52c1929efc9c";

        // ================================================================
        // BAN সিলেক্ট
        // ================================================================
        function selectBanOption(type) {
            const noBtn = document.getElementById('banNoBtn');
            const yesBtn = document.getElementById('banYesBtn');
            const hiddenInput = document.getElementById('homeBanStatus');

            noBtn.classList.remove('active-no-ban', 'active-ban');
            yesBtn.classList.remove('active-no-ban', 'active-ban');

            if (type === 'no') {
                noBtn.classList.add('active-no-ban');
                hiddenInput.value = 'no';
            } else {
                yesBtn.classList.add('active-ban');
                hiddenInput.value = 'yes';
            }
        }

        // ================================================================
        // সার্ভার সিলেক্ট
        // ================================================================
        function selectServer(server) {
            const btns = document.querySelectorAll('.server-option-btn');
            btns.forEach(btn => btn.classList.remove('active-server'));
            
            // Find the button with matching text
            btns.forEach(btn => {
                if (btn.textContent.trim() === server || btn.textContent.trim().includes(server)) {
                    btn.classList.add('active-server');
                }
            });
            
            document.getElementById('homeServer').value = server;
            
            // Hide others box if a predefined server is selected
            if (server !== 'Others') {
                document.getElementById('serverOtherBox').classList.remove('show');
            }
        }

        function toggleServerOther() {
            const box = document.getElementById('serverOtherBox');
            box.classList.toggle('show');
            if (box.classList.contains('show')) {
                document.getElementById('homeServer').value = 'Others';
                // Remove active from all server buttons
                document.querySelectorAll('.server-option-btn').forEach(btn => btn.classList.remove('active-server'));
            }
        }

        // ================================================================
        // কন্টাক্ট টাইপ সিলেক্ট
        // ================================================================
        function selectContact(type) {
            const btns = document.querySelectorAll('.contact-type-btn');
            btns.forEach(btn => btn.classList.remove('active-contact'));
            
            const map = {
                'facebook': 'contactFacebook',
                'gmail': 'contactGmail',
                'twitter': 'contactTwitter',
                'phone': 'contactPhone'
            };
            
            document.getElementById(map[type]).classList.add('active-contact');
            document.getElementById('homeContactType').value = type;
        }

        // ================================================================
        // আদারস গেম টগল
        // ================================================================
        function toggleOtherGame() {
            const val = document.getElementById('homeCategory').value;
            const box = document.getElementById('otherGameBox');
            if (val === 'Others') {
                box.classList.add('show');
            } else {
                box.classList.remove('show');
            }
        }

        // ================================================================
        // ইমেজ আপলোড (ImgBB)
        // ================================================================
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const label = document.getElementById('fileLabel');
            const preview = document.getElementById('previewImg');

            label.textContent = 'Uploading...';
            label.style.opacity = '0.5';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    const url = data.data.url;
                    document.getElementById('homeImageUrl').value = url;
                    preview.src = url;
                    preview.classList.add('show');
                    label.textContent = '✅ Image Uploaded';
                    label.classList.add('has-image');
                    label.style.opacity = '1';
                } else {
                    alert('Image upload failed!');
                    label.textContent = '❌ Upload Failed';
                    label.style.opacity = '1';
                }
            } catch (e) {
                alert('Error uploading image!');
                label.textContent = '❌ Error';
                label.style.opacity = '1';
            }
        }

        // ================================================================
        // ফ্লোটিং বাটন ও মোডাল
        // ================================================================
        function toggleUploadModal() {
            const modal = document.getElementById('uploadModal');
            const fabBtn = document.getElementById('fabBtn');
            
            modal.classList.toggle('active');
            fabBtn.classList.toggle('open');
            
            if (!modal.classList.contains('active')) {
                document.getElementById('uploadForm').reset();
                document.getElementById('previewImg').classList.remove('show');
                document.getElementById('fileLabel').textContent = 'Choose Image';
                document.getElementById('fileLabel').classList.remove('has-image');
                document.getElementById('homeImageUrl').value = '';
                document.getElementById('otherGameBox').classList.remove('show');
                document.getElementById('serverOtherBox').classList.remove('show');
                selectBanOption('no');
                selectContact('facebook');
                selectServer('Bangladesh');
            }
        }

        document.getElementById('uploadModal').addEventListener('click', function(e) {
            if (e.target === this) {
                toggleUploadModal();
            }
        });

        // ================================================================
        // আপলোড (ইউজারের UID সহ)
        // ================================================================
        function submitAppFromHome(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.upload-btn-submit');
            
            if (!currentLoggedUser) {
                showMessage('আপনি লগইন নাই! দয়া করে লগইন করুন।', 'error');
                toggleUploadModal();
                setTimeout(() => { window.location.href = 'user-login.html?redirect=index.html'; }, 1500);
                return;
            }

            const banStatus = document.getElementById('homeBanStatus').value;
            const category = document.getElementById('homeCategory').value;
            let gameCategory = category;
            if (category === 'Others') {
                gameCategory = document.getElementById('homeOtherGame').value.trim() || 'Others';
            }

            // সার্ভার
            let server = document.getElementById('homeServer').value;
            if (server === 'Others') {
                server = document.getElementById('homeOtherServer').value.trim() || 'Others';
            }

            const imageUrl = document.getElementById('homeImageUrl').value.trim();
            if (!imageUrl) {
                showMessage('দয়া করে একটি ছবি আপলোড করুন!', 'error');
                return;
            }

            const data = {
                title: document.getElementById('homeTitle').value.trim(),
                gameCategory: gameCategory,
                imageUrl: imageUrl,
                email: document.getElementById('homeEmail').value.trim(),
                contactType: document.getElementById('homeContactType').value,
                contactValue: document.getElementById('homeContactValue').value.trim(),
                isBanned: banStatus === 'yes' ? true : false,
                server: server,
                timestamp: Date.now(),
                isUpdated: true,
                uid: currentLoggedUser.uid,
                userEmail: currentLoggedUser.email
            };

            if (!data.title || !data.email || !data.contactValue) {
                showMessage('সব প্রয়োজনীয় ফিল্ড পূরণ করুন!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPLOADING...';

            database.ref(DB_PATH).push(data)
                .then(() => {
                    showMessage('✅ Uploaded Successfully!');
                    toggleUploadModal();
                    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> PUBLISH';
                    btn.disabled = false;
                    document.getElementById('uploadForm').reset();
                    document.getElementById('previewImg').classList.remove('show');
                    document.getElementById('fileLabel').textContent = 'Choose Image';
                    document.getElementById('fileLabel').classList.remove('has-image');
                    document.getElementById('homeImageUrl').value = '';
                    document.getElementById('otherGameBox').classList.remove('show');
                    document.getElementById('serverOtherBox').classList.remove('show');
                    selectBanOption('no');
                    selectContact('facebook');
                    selectServer('Bangladesh');
                })
                .catch((error) => {
                    showMessage('Error: ' + error.message, 'error');
                    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> PUBLISH';
                    btn.disabled = false;
                });
        }

        // ================================================================
        // 🔐 লগইন
        // ================================================================
        function loginFromOverlay() {
            const email = document.getElementById('loginEmailOverlay').value.trim();
            const pass = document.getElementById('loginPasswordOverlay').value.trim();
            const errorEl = document.getElementById('loginErrorOverlay');
            const btn = document.getElementById('loginBtnOverlay');

            if (!email || !pass) {
                errorEl.textContent = 'Please fill in all fields!';
                errorEl.style.display = 'block';
                return;
            }

            errorEl.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> LOGGING IN...';
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {})
                .catch((err) => {
                    errorEl.textContent = err.message || 'Invalid email or password!';
                    errorEl.style.display = 'block';
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SECURE LOGIN';
                    btn.disabled = false;
                });
        }

        function googleLoginOverlay() {
            const btn = document.querySelector('.login-google-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> LOADING...';
            btn.disabled = true;

            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    db.ref('registered_users/' + result.user.uid).once('value').then(snap => {
                        if (!snap.exists()) {
                            db.ref('registered_users/' + result.user.uid).set({
                                name: result.user.displayName,
                                email: result.user.email,
                                joinedAt: Date.now()
                            });
                        }
                    });
                })
                .catch((err) => {
                    document.getElementById('loginErrorOverlay').textContent = err.message || 'Google login failed!';
                    document.getElementById('loginErrorOverlay').style.display = 'block';
                    btn.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" class="google-icon"> LOGIN WITH GOOGLE';
                    btn.disabled = false;
                });
        }

        document.getElementById('loginPasswordOverlay').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loginFromOverlay();
        });
        document.getElementById('loginEmailOverlay').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loginFromOverlay();
        });

        // ================================================================
        // অ্যাডমিন প্যানেল
        // ================================================================
        function updateAdminPanelVisibility(user) {
            const freePanel = document.getElementById('freePanelLink');
            const ownerPanel = document.getElementById('ownerPanelLink');

            if (user && user.email === ADMIN_EMAIL) {
                freePanel.classList.remove('admin-panel-hidden');
                ownerPanel.classList.remove('admin-panel-hidden');
            } else {
                freePanel.classList.add('admin-panel-hidden');
                ownerPanel.classList.add('admin-panel-hidden');
            }
        }

        // ================================================================
        // Auth State
        // ================================================================
        auth.onAuthStateChanged((user) => {
            currentLoggedUser = user;
            const overlay = document.getElementById('loginOverlay');
            const mainContent = document.getElementById('mainContent');

            updateAdminPanelVisibility(user);

            if (user) {
                overlay.classList.add('hidden');
                mainContent.style.display = 'block';
                document.getElementById('sidebarUserText').innerText = "MY PROFILE";
                loadFirebaseData();
            } else {
                overlay.classList.remove('hidden');
                mainContent.style.display = 'none';
                document.getElementById('sidebarUserText').innerText = "LOGIN / SETTINGS";
                const btn = document.getElementById('loginBtnOverlay');
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SECURE LOGIN';
                btn.disabled = false;
            }
        });

        // ================================================================
        // বাকি ফাংশন
        // ================================================================
        function showMessage(msg, type='success') {
            const toast = document.getElementById('localToast');
            document.getElementById('localToastMsg').innerText = msg;
            toast.style.borderLeftColor = type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function timeAgo(timestamp) {
            if (!timestamp) return "";
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            let interval = seconds / 86400;
            if (interval >= 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval >= 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval >= 1) return Math.floor(interval) + " mins ago";
            return "Just now";
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function toggleSearch() {
            const box = document.getElementById('searchContainer');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            if(box.style.display === 'block') document.getElementById('searchInput').focus();
        }

        function checkLoginAndGoFree() {
            if(currentLoggedUser) {
                window.location.href = 'free-admin.html';
            } else {
                showMessage('লগইন ছাড়া ফ্রি এডমিনে ঢোকা নিষেধ!', 'error');
                setTimeout(() => { window.location.href = 'user-login.html?redirect=free-admin.html'; }, 2000);
            }
        }

        function openPassModal(url) {
            targetAdminUrl = url;
            document.getElementById('passModalOverlay').style.display = 'flex';
            document.getElementById('adminPassInput').value = '';
            document.getElementById('adminPassInput').focus();
            toggleSidebar(); 
        }

        function closePassModal() {
            document.getElementById('passModalOverlay').style.display = 'none';
        }

        function verifyAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === "121345") {
                sessionStorage.setItem('mvx_admin_token', 'SECURE_AUTHORIZED');
                window.location.href = targetAdminUrl;
            } else {
                showMessage("Incorrect Access Code!", "error");
                document.getElementById('adminPassInput').value = '';
            }
        }

        document.getElementById('adminPassInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyAdminPass();
        });

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            displayLimit = 10;
            filterAndRender();
        }

        function goToDetails(appId) {
            window.location.href = `details.html?id=${appId}`;
        }

        function loadMoreApps() {
            displayLimit += 10;
            filterAndRender();
        }

        // ================================================================
        // ডেটা লোড - শুধু লগইন করা ইউজারের পোস্ট দেখাবে
        // ================================================================
        function loadFirebaseData() {
            database.ref(DB_PATH).on('value', (snap) => {
                const data = snap.val();
                if(!data) {
                    document.getElementById('feedContainer').innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><h3>No Data Available</h3></div>`;
                    return;
                }

                const currentUid = currentLoggedUser ? currentLoggedUser.uid : null;
                
                allApps = Object.entries(data)
                    .map(([key, val]) => ({ id: key, ...val, isHidden: val.isHidden || false }))
                    .filter(app => {
                        if (!currentUid) return false;
                        return app.uid === currentUid && !app.isHidden;
                    })
                    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                filterAndRender();
            });
        }

        // ================================================================
        // রেন্ডার - ডিলিট বাটন ছাড়া (শুধু টাইটেল + সময় + সার্ভার)
        // ================================================================
        function filterAndRender() {
            const feed = document.getElementById('feedContainer');
            const loadMoreBtn = document.getElementById('loadMoreContainer');
            feed.innerHTML = '';

            let filtered = allApps;
            if(searchQuery) filtered = filtered.filter(app => 
                (app.title || '').toLowerCase().includes(searchQuery) ||
                (app.gameCategory || '').toLowerCase().includes(searchQuery) ||
                (app.email || '').toLowerCase().includes(searchQuery)
            );

            if(filtered.length === 0) {
                feed.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>No Results Found</h3></div>`;
                loadMoreBtn.style.display = 'none';
                return;
            }

            const appsToShow = filtered.slice(0, displayLimit);

            let htmlContent = '';
            appsToShow.forEach(app => {
                const imageSrc = app.imageUrl || 'https://via.placeholder.com/800x450/1a1f2c/00e6b8?text=NO+IMAGE';
                
                let banBadge = '';
                if (app.isBanned === true) {
                    banBadge = `<div class="ban-badge"><i class="fas fa-ban"></i> BANNED</div>`;
                } else {
                    banBadge = `<div class="noban-badge"><i class="fas fa-check-circle"></i> NO BAN</div>`;
                }

                const timeString = app.timestamp ? ` • ${timeAgo(app.timestamp)}` : '';

                // সার্ভার ব্যাজ
                const serverText = app.server || 'N/A';
                const serverBadge = `<div class="server-badge"><i class="fas fa-globe"></i> ${serverText}</div>`;

                htmlContent += `
                    <div class="yt-card" onclick="goToDetails('${app.id}')">
                        <div class="yt-banner-wrapper">
                            ${banBadge}
                            ${serverBadge}
                            <img src="${imageSrc}" class="yt-banner" loading="lazy">
                        </div>
                        <div class="yt-info">
                            <div class="yt-text">
                                <h3 class="yt-title">${app.title || 'Untitled'}</h3>
                                <div class="yt-meta">
                                    ${app.gameCategory || 'N/A'} 
                                    <span class="badge-type ${app.accessType ? app.accessType.toLowerCase() : 'free'}">${app.accessType || 'Free'}</span>
                                    ${timeString}
                                    <br>
                                    <i class="fas fa-envelope" style="font-size:0.8rem;"></i> ${app.email || 'N/A'}
                                    <br>
                                    <i class="fas fa-phone" style="font-size:0.8rem;"></i> ${app.contactValue || 'N/A'} 
                                    <span style="font-size:0.7rem;color:var(--text-muted);">(${app.contactType || 'N/A'})</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            feed.innerHTML = htmlContent;

            if (filtered.length > displayLimit) {
                loadMoreBtn.style.display = 'block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }
    </script>
</body>
</html>
