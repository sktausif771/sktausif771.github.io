<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>MVX STORE | Play UI V5.0</title>
    
    <script>
        if (sessionStorage.getItem('mvx_session') !== 'ACTIVE') {
            window.location.replace('login.html');
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="play-top-nav">
        <div class="top-brand">
            <img src="https://via.placeholder.com/40/020617/00e6b8?text=MVX" alt="Logo" class="nav-logo">
            <span class="brand-text">MVX STORE</span>
        </div>
        <div class="top-actions">
            <i class="fas fa-bars admin-menu-btn" id="adminMenuToggle" style="display: none;" onclick="toggleAdminSidebar()"></i>
            <i class="fas fa-bell noti-icon"></i>
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="Profile" class="top-profile-pic" id="topProfileBtn" onclick="openProfileEditModal()">
        </div>
    </header>

    <div class="admin-sidebar-overlay" id="adminOverlay" onclick="toggleAdminSidebar()"></div>
    <div class="admin-sidebar" id="adminSidebar">
        <div class="admin-header">
            <h3><i class="fas fa-shield-alt"></i> SYSTEM PANEL</h3>
            <i class="fas fa-times" onclick="toggleAdminSidebar()" style="cursor:pointer; color:#ff003c;"></i>
        </div>
        <div class="admin-links">
            <a href="admin.html" id="linkAdmin" style="display:none;"><i class="fas fa-tasks"></i> Admin Dashboard</a>
            <a href="owner.html" id="linkOwner" style="display:none;"><i class="fas fa-crown" style="color:#ffd700;"></i> Master Owner</a>
        </div>
    </div>

    <main class="play-main-content" id="mainStoreFeed">
        
        <div class="play-categories">
            <button class="cat-chip active" data-filter="for_you">For you</button>
            <button class="cat-chip" data-filter="premium">Premium</button>
            <button class="cat-chip" data-filter="free">Free Games</button>
        </div>

        <h2 class="play-section-title">Recommended for you <i class="fas fa-arrow-right"></i></h2>
        
        <div class="play-app-grid" id="storeAppGrid">
            <div style="text-align:center; padding: 40px; grid-column: 1/-1;">
                <i class="fas fa-spinner fa-spin" style="font-size:30px; color:#00e6b8;"></i>
                <p style="margin-top:10px; color:#94a3b8;">Loading Store Data...</p>
            </div>
        </div>

    </main>

    <main class="play-main-content" id="youTabContent" style="display: none;">
        <div class="you-header">
            <img src="" id="youTabAvatar" alt="User">
            <div class="you-info">
                <h2 id="youTabName">Loading...</h2>
                <p id="youTabEmail">user@mvx.com</p>
            </div>
        </div>

        <div class="you-menu-list">
            <div class="you-menu-item" onclick="openUploadModal()">
                <i class="fas fa-cloud-upload-alt" style="color: #00e6b8;"></i>
                <span>Upload Application</span>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
            <div class="you-menu-item">
                <i class="fas fa-history" style="color: #94a3b8;"></i>
                <span>Download History</span>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
            <div class="you-menu-item">
                <i class="fas fa-wallet" style="color: #ffd700;"></i>
                <span>MVX Coins Wallet</span>
                <span style="margin-left:auto; margin-right:15px; font-weight:bold; color:#ffd700;" id="youCoinBalance">0</span>
            </div>
            <div class="you-menu-item" style="color: #ff003c;" onclick="secureLogout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </div>
        </div>
    </main>

    <nav class="play-bottom-nav">
        <div class="nav-item active" onclick="switchTab('games', this)">
            <i class="fas fa-gamepad"></i>
            <span>Games</span>
        </div>
        <div class="nav-item" onclick="switchTab('apps', this)">
            <i class="fas fa-layer-group"></i>
            <span>Apps</span>
        </div>
        <div class="nav-item" onclick="switchTab('search', this)">
            <i class="fas fa-search"></i>
            <span>Search</span>
        </div>
        <div class="nav-item" onclick="switchTab('you', this)">
            <i class="fas fa-user-circle"></i>
            <span>You</span>
        </div>
    </nav>

    <div class="modal-overlay" id="profileEditModal">
        <div class="play-modal">
            <div class="modal-header">
                <h3>Edit Profile</h3>
                <i class="fas fa-times close-modal" onclick="closeProfileEditModal()"></i>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 20px;">
                    <img src="" id="editPreviewAvatar" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid #00e6b8; margin-bottom:10px;">
                </div>
                <label class="modal-label">Display Name</label>
                <input type="text" id="editNameInput" class="play-input" placeholder="Enter your name">
                
                <label class="modal-label" style="margin-top:15px;">Profile Picture (ImgBB / URL)</label>
                <input type="text" id="editAvatarInput" class="play-input" placeholder="Paste direct image link here">
                
                <button class="play-btn" style="margin-top: 20px;" onclick="saveProfileChanges()">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="firebase-config.js"></script>
    <script src="main.js"></script>
    <script src="store-logic.js"></script>

    <script>
        // Tab Switching Logic
        function switchTab(tabName, element) {
            // Update Active State on Nav
            document.querySelectorAll('.play-bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Switch Content
            const feed = document.getElementById('mainStoreFeed');
            const youTab = document.getElementById('youTabContent');

            if(tabName === 'you') {
                feed.style.display = 'none';
                youTab.style.display = 'block';
            } else if (tabName === 'search') {
                // Search logic can be implemented here later
                feed.style.display = 'block';
                youTab.style.display = 'none';
            } else {
                feed.style.display = 'block';
                youTab.style.display = 'none';
            }
        }

        // Admin Sidebar Logic
        function toggleAdminSidebar() {
            document.getElementById('adminSidebar').classList.toggle('active');
            document.getElementById('adminOverlay').classList.toggle('active');
        }

        // Profile Edit Modal Logic
        function openProfileEditModal() {
            document.getElementById('profileEditModal').classList.add('active');
        }
        function closeProfileEditModal() {
            document.getElementById('profileEditModal').classList.remove('active');
        }
    </script>
</body>
</html>
